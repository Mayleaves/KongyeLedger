let calcExpression='', calcSettled=false;
const calcOperators='÷×−+';
function openCalculator(){
  calcExpression=mAmt;
  calcSettled=false;
  // Exact Fig.2 distribution:
  // Row 1: +  −  ×  ÷
  // Row 2: 7  8  9  ⌫
  // Row 3: 4  5  6  =
  // Row 4: 1  2  3  [填入金额 (row 4-5)]
  // Row 5: 清空 0  .
  const keys=['+','−','×','÷','7','8','9','⌫','4','5','6','=','1','2','3','填入金额','清空','0','.'];
  openEntryTool('计算器','open-calculator',`
    <div class="calc-readout">
      <div class="calc-expression num" id="calc-expression"></div>
      <p class="calc-feedback num" id="calc-feedback" role="status"></p>
    </div>
    <div class="kgrid calc-keys" aria-label="计算器键盘">
      ${keys.map(key=>{
        if(key==='填入金额')return '<button type="button" class="kk ok" onclick="calculateAmount(true)">填入金额</button>';
        if(key==='⌫')return `<button type="button" class="kk operation" aria-label="退格" onclick="tapCalculator('⌫')">${ico('backspace',21)}</button>`;
        const cls=calcOperators.includes(key)||key==='='?'operation':key==='清空'?'clear':key==='.'?'num dot':'num';
        return `<button type="button" class="kk ${cls}" onclick="tapCalculator(${arg(key)})">${key}</button>`;
      }).join('')}
    </div>
  `);
  previewCalculator();
}
function formatCalcExpressionHTML(expr){
  if(!expr)return '0';
  return esc(expr).replace(/([÷×−+])/g,'<span class="calc-op">$1</span>');
}
function updateCalculatorReadout(message='',mode=''){
  const exprEl=document.getElementById('calc-expression');
  const feedback=document.getElementById('calc-feedback');
  if(!exprEl||!feedback)return;
  const len=calcExpression.length;
  exprEl.className=`calc-expression num ${!calcExpression?'is-zero':''} ${mode==='result'?'settled':len>18?'long':len>12?'mid':''}`;
  exprEl.innerHTML=formatCalcExpressionHTML(calcExpression)+(mode==='result'?' <span class="calc-op">=</span>':'');
  feedback.textContent=message;
  feedback.className=`calc-feedback num ${mode}`;
}
function previewCalculator(){
  if(!calcExpression){updateCalculatorReadout('','');return;}
  const cleaned=calcExpression.replace(/[÷×−+]$/,'');
  if(!cleaned||!/[÷×−+]/.test(cleaned)){updateCalculatorReadout('','');return;}
  const res=JSON.parse(Ledger.calculateEntryAmount(cleaned));
  if(!res.error)updateCalculatorReadout(`= ¥${fmt(res.cents)}`,'preview');
  else updateCalculatorReadout('','');
}
function tapCalculator(key){
  if(key==='='){calculateAmount(false);return;}
  if(key==='清空'){calcExpression='';calcSettled=false;}
  else if(key==='⌫'){calcExpression=calcExpression.slice(0,-1);calcSettled=false;}
  else if(calcOperators.includes(key)){
    if(!calcExpression)return;
    if(calcSettled){
      const res=JSON.parse(Ledger.calculateEntryAmount(calcExpression));
      if(!res.error&&res.cents>0)calcExpression=fmt(res.cents).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
      calcSettled=false;
    }
    if(/[÷×−+]$/.test(calcExpression))calcExpression=calcExpression.slice(0,-1);
    calcExpression+=key;
  }else{
    if(calcSettled){calcExpression='';calcSettled=false;}
    const term=calcExpression.split(/[÷×−+]/).at(-1);
    const [integer,fraction]=term.split('.');
    if(key==='.'&&fraction===undefined)calcExpression+=(term?'':'0')+'.';
    else if(/^\d$/.test(key)&&((fraction===undefined&&integer.length<10)||fraction?.length<2)){
      if(term==='0'&&key==='0')return;
      if(term==='0'&&key!=='0')calcExpression=calcExpression.slice(0,-1)+key;
      else calcExpression+=key;
    }
  }
  if(calcExpression.length>96)calcExpression=calcExpression.slice(0,96);
  previewCalculator();
}
function calculateAmount(useAmount=false){
  const expr=useAmount?calcExpression.replace(/[÷×−+]$/,''):calcExpression;
  const result=JSON.parse(Ledger.calculateEntryAmount(expr));
  if(result.error){calcSettled=false;updateCalculatorReadout(result.error,'');return;}
  if(!useAmount){
    calcSettled=true;
    updateCalculatorReadout(`¥${fmt(result.cents)}`,'result');
    return;
  }
  if(result.cents<=0){calcSettled=false;updateCalculatorReadout('记账金额必须大于 0','');return;}
  mAmt=fmt(result.cents).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
  renderAddSheet();
  closeEntryTool();
}
function parsePasteSms(){
  const txt = document.getElementById('sms-box').value;
  const result=JSON.parse(Ledger.parseMessage(txt));
  if(result.error){toast(result.error);return;}
  closeSheet();
  syncLedger();
  openEditSheet(result.id);
}
function tapK(k){
  if(k==='⌫') mAmt=mAmt.slice(0,-1); else if(k==='清零') mAmt='';
  else if(k==='.'){ if(!mAmt.includes('.')) mAmt = mAmt ? mAmt+'.' : '0.'; }
  else if(k==='0' && mAmt==='0'){ return; }
  else if(/^\d$/.test(k) && mAmt==='0'){ mAmt = k; }
  else if((!mAmt.includes('.') || mAmt.split('.')[1].length<2) && mAmt.length<8) mAmt += k;
  if(!updateManualAmountDOM()) renderAddSheet();
}
function saveManual(){
  const cents = moneyInput(mAmt);
  if(cents<=0){ toast('请输入大于 0 的金额'); return; }
  if(!mCat){toast('请先添加一个分类');return;}
  S.txns.unshift({id:Ledger.newId(), date:mDate||TODAY, time:mTime||clockTime(), merchant:mMer.trim()||mCat, category:mCat, dir:mDir, cents, source:'手动记录', auto:false, merged:'', status:'已入账', note:'', score:-1});
  if(!save())return; mAmt=''; mMer=''; mDate=TODAY; mTime=''; closeSheet(); spawnCoinBurst(); render(); toast(`✓ 已记下 ${mDir} ¥${fmt(cents)}`);
}

let editCategory=null, editDate=null, editTime=null;
function openEditSheet(id,keepDraft=false){
  const t = S.txns.find(x=>x.id===id); if(!t) return;
  if(!keepDraft){editCategory=t.category;editDate=t.date;editTime=t.time;}
  const cats = [...new Set([...entryCategories(t.dir),t.category])];
  document.getElementById('sheet-root').innerHTML = `<div class="mask" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <div class="backup-heading"><h3>${t.status==='待确认'?'噗噗抓到新账单，请确认分类':'账单详情与编辑'}</h3><button type="button" class="ibtn" aria-label="关闭详情" onclick="closeSheet()">×</button></div>
    <div class="num" style="font-size:34px;font-weight:800;text-align:center;margin:10px 0 14px;color:${t.dir==='收入'?'var(--green)':'var(--ink)'}">${t.dir==='收入'?'+':'-'}¥${fmt(t.cents)}</div>
    <div class="card" style="padding:4px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--div);font-size:13.5px">
        <span style="color:var(--muted)">商户名称</span>
        <input id="ed-mer" value="${esc(t.merchant)}" style="width:62%;border:0;background:transparent;text-align:right;font:inherit;font-weight:700;color:var(--ink);outline:none"/>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--div);font-size:13.5px">
        <span style="color:var(--muted)">交易时间</span>
        <span id="ed-datetime-control">${dateTimeButton(editDate,editTime,'openEditDateTime()','edit-datetime-button')}</span>
      </div>
      <label class="edit-field">金额（元） <input id="ed-amt" class="num" inputmode="decimal" value="${fmt(t.cents)}"></label>
      <label class="edit-field" style="border-bottom:0">备注 <input id="ed-note" placeholder="添加备注…" value="${esc(t.note)}"></label>
    </div>
    <div class="frow" style="margin-top:14px">
      ${cats.map(c=>`<button class="qbtn ${editCategory===c?'on':''}" onclick="setEditCat(${arg(t.id)},${arg(c)})">${esc(c)}</button>`).join('')}
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-top:13px;cursor:pointer">
      <input type="checkbox" id="ed-learn" checked/> 记住规则：以后该商户自动归为「${esc(editCategory)}」
    </label>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px">
      <button class="cta-btn ghost" onclick="S.txns=S.txns.filter(x=>x.id!==${arg(t.id)});if(save()){closeSheet();toast('已删除')}">删除</button>
      <button class="cta-btn" onclick="commitEdit(${arg(t.id)})">确认保存</button>
    </div>
  </div></div>`;
}
function openEditDateTime(){
  pickDateTime(editDate,editTime,'交易日期与时间',(date,time)=>{
    editDate=date;
    editTime=time;
    const ctrl=document.getElementById('ed-datetime-control');
    if(ctrl)ctrl.innerHTML=dateTimeButton(editDate,editTime,'openEditDateTime()','edit-datetime-button');
  });
}
function setEditCat(id,category){
  const merchant=document.getElementById('ed-mer').value;
  const amount=document.getElementById('ed-amt').value;
  const note=document.getElementById('ed-note').value;
  const learn=document.getElementById('ed-learn').checked;
  editCategory=category;
  openEditSheet(id,true);
  document.getElementById('ed-mer').value=merchant;
  document.getElementById('ed-amt').value=amount;
  document.getElementById('ed-note').value=note;
  document.getElementById('ed-learn').checked=learn;
}
function commitEdit(id){
  const t=S.txns.find(x=>x.id===id); if(!t) return;
  const mv = document.getElementById('ed-mer').value.trim(), dv = editDate;
  const amount=moneyInput(document.getElementById('ed-amt').value);
  if(!amount){toast('请输入有效金额');return;}
  t.cents=amount;
  t.note=document.getElementById('ed-note').value.trim();
  t.category=editCategory;
  if(mv) t.merchant=mv; if(dv) t.date=dv; if(editTime)t.time=editTime; t.status='已入账';
  if(document.getElementById('ed-learn').checked) S.rules={...S.rules,[t.merchant]:t.category};
  if(!save())return; closeSheet(); spawnCoinBurst(); render(); toast('已保存账单');
}

function moneyInput(value){
  const text=String(value).trim();
  if(!/^\d{1,10}(?:\.\d{0,2})?$/.test(text))return 0;
  return Math.round(Number(text)*100);
}
const budgetPeriods={day:'日',week:'周',month:'月',quarter:'季',year:'年'};
function openQuotaDetails(){
  const basis=S.quotaDetails;
  const spent=dayStat(TODAY).out, quota=getQuota(), available=quota-spent;
  const row=(label,value)=>`<div class="quota-row"><dt>${label}</dt><dd>${value}</dd></div>`;
  document.getElementById('sheet-root').innerHTML=`<div class="mask" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="日额度怎么算">
    <div class="backup-heading"><h3>日额度怎么算</h3><button class="ibtn" aria-label="关闭计算明细" onclick="closeSheet()">×</button></div>
    <div class="quota-details">
      ${basis?`<p class="quota-note">按当前预算和账单计算${Object.values(S.budgetLimits).filter(v=>v>0).length>1?' · 采用最紧的周期额度':''}</p><dl class="quota-rows">
        ${row(`${budgetPeriods[basis.period]}预算`,`¥${fmt(basis.limit)}`)}
        ${row('本期截至昨天的净支出',`¥${fmt(basis.earlierSpending)}`)}
        ${row('剩余天数（含今天）',`${basis.daysLeft} 天`)}
        ${row('期内余额 ÷ 剩余天数',`¥${fmt(basis.remaining)} ÷ ${basis.daysLeft} = ¥${fmt(basis.daily)}`)}
      </dl>`:''}
      <dl class="quota-rows">
        ${row('首页日额度',`¥${fmt(quota)}`)}
        ${row('减去今天净支出',`¥${fmt(spent)}`)}
        ${row(available>=0?'今天还能花':'今日超支',`¥${fmt(Math.abs(available))}`)}
      </dl>
    </div>
    <button class="cta-btn ghost" onclick="openBudgetSheet()">改预算</button>
  </section></div>`;
}
let budgetPeriod='month',budgetDraft={};
function openBudgetSheet(){
  budgetDraft=Object.fromEntries(Object.keys(budgetPeriods).map(key=>[key,S.budgetLimits[key]>0?fmt(S.budgetLimits[key]):'']));
  renderBudgetSheet();
}
function pickBudgetPeriod(period){budgetPeriod=period;renderBudgetSheet();}
function renderBudgetSheet(){
  const label=budgetPeriods[budgetPeriod];
  const used=S.budgetSpent[budgetPeriod]||0;
  const limit=moneyInput(budgetDraft[budgetPeriod]);
  document.getElementById('sheet-root').innerHTML = `<div class="mask" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="设置预算">
    <div class="backup-heading"><h3>设置预算</h3><button class="ibtn" aria-label="关闭预算" onclick="closeSheet()">×</button></div>
    <div class="budget-periods">${Object.entries(budgetPeriods).map(([key,name])=>
      `<button class="qbtn ${key===budgetPeriod?'on':''}" aria-pressed="${key===budgetPeriod}" onclick="pickBudgetPeriod('${key}')">${name}</button>`).join('')}</div>
    <div class="budget-card">
      <label for="budget-input" style="font-size:13px;font-weight:700">${label}预算（元）</label>
      <input id="budget-input" inputmode="decimal" autocomplete="off" value="${esc(budgetDraft[budgetPeriod])}" placeholder="输入金额" oninput="budgetDraft[budgetPeriod]=this.value;updateBudgetReadout()"/>
      <small id="budget-readout">${budgetReadout(used,limit)}</small>
      <small>可同时设置多个周期。首页日额度按最紧的预算计算，留空可停用本周期。</small>
    </div>
    <button class="cta-btn" onclick="commitBudget()">保存预算</button>
  </section></div>`;
}
function budgetReadout(used,limit){
  return `本期已用 ¥${fmt(used)}${limit>0?` · ${used>limit?'超出':'剩余'} ¥${fmt(Math.abs(limit-used))}`:''}`;
}
function updateBudgetReadout(){
  document.getElementById('budget-readout').textContent=budgetReadout(S.budgetSpent[budgetPeriod]||0,moneyInput(budgetDraft[budgetPeriod]));
}
function commitBudget(){
  const limits={};
  for(const period of Object.keys(budgetPeriods)){
    const value=budgetDraft[period].trim();
    if(value&&!/^\d{1,10}(?:\.\d{1,2})?$/.test(value)){
      pickBudgetPeriod(period);document.getElementById('budget-input').focus();toast('请输入有效预算金额');return;
    }
    limits[period]=moneyInput(value);
  }
  S.budgetLimits=limits;
  if(save()){closeSheet();toast('预算已保存');}
}

function finishStartup(deadline){
  if(document.getElementById('phone').offsetHeight === 0){
    if(performance.now() >= deadline) Ledger.startupFailed();
    else requestAnimationFrame(() => finishStartup(deadline));
    return;
  }
  Ledger.ready();
}

try {
  render();
  bindSubpageSwipe();
  finishStartup(performance.now() + 5000);
  const refreshDate=()=>{
    if(!document.hidden && dateKey(new Date())!==TODAY)syncLedger();
  };
  document.addEventListener('keydown',event=>{
    if(event.metaKey||event.ctrlKey||event.altKey)return;
    if(datePicker){
      if(event.key==='Escape'){event.preventDefault();closeDatePicker();return;}
      if(event.key==='Enter'&&event.target.classList?.contains('dt-time-input')){event.preventDefault();confirmPickerDay();return;}
    }
    if(event.target.closest('input,textarea,select,[contenteditable]')){
      if(event.key==='Enter'&&event.target.id==='manual-mer-input'){event.preventDefault();event.target.blur();}
      return;
    }
    if(document.getElementById('calc-expression')){
      if(/^[0-9.]$/.test(event.key)){event.preventDefault();tapCalculator(event.key);}
      else if(event.key==='+'){event.preventDefault();tapCalculator('+');}
      else if(event.key==='-'){event.preventDefault();tapCalculator('−');}
      else if(event.key==='*'){event.preventDefault();tapCalculator('×');}
      else if(event.key==='/'){event.preventDefault();tapCalculator('÷');}
      else if(event.key==='Backspace'){event.preventDefault();tapCalculator('⌫');}
      else if(event.key==='Enter'){event.preventDefault();calculateAmount(true);}
      else if(event.key==='Escape'){event.preventDefault();closeEntryTool();}
      return;
    }
    if(document.getElementById('manual-amt-val')&&!document.getElementById('date-root').firstElementChild&&!document.getElementById('entry-tool-root').firstElementChild){
      if(/^[0-9.]$/.test(event.key)){event.preventDefault();tapK(event.key);}
      else if(event.key==='Backspace'){event.preventDefault();tapK('⌫');}
      else if(event.key==='Enter'){event.preventDefault();saveManual();}
      else if(event.key==='Escape'){event.preventDefault();closeSheet();}
    }
  });
  document.addEventListener('visibilitychange',refreshDate);
  setInterval(refreshDate,30000);
} catch (error) {
  Ledger.startupFailed();
}
</script>
</body>
