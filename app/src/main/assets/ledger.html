<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>空叶记账 · 手机演示版</title>
<style>
:root,body[data-style="meditation"]{
  --page:#efeae0;--canvas:#f7f3e8;--canvas-bg:#f7f3e8;--bezel:#fffdf9;--bezel-line:rgba(168,144,108,.25);
  --card:#ffffff;--card-soft:rgba(255,255,255,.78);--blur:0px;--radius:24px;--border:1px solid rgba(180,158,125,.12);
  --shadow:0 8px 24px rgba(140,120,90,.08);--cta:#2f68e6;--cta-fg:#fff;--cta-sh:0 8px 18px -4px rgba(47,104,230,.34);
  --dock:rgba(255,255,255,.92);--dock-on:rgba(47,104,230,.11);--track:rgba(175,148,112,.13);
  --ink:#3d3126;--ink2:#5c4b3b;--muted:#968471;--div:rgba(175,148,112,.14);--green:#28a464;--red:#e05a50;
  --prog:linear-gradient(90deg,#f9b4b8,#f3969b);--spring:cubic-bezier(.26,1.26,.48,1);--jelly:cubic-bezier(.34,1.52,.64,1);
}


*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI",-apple-system,system-ui,sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;user-select:none;transition:background .28s ease}
.num{font-family:"SF Pro Rounded","Nunito","Segoe UI",ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.p8-s0{fill:none;stroke:#da746a;stroke-width:18px;stroke-linecap:round;stroke-linejoin:round}
.p8-s1{fill:none;stroke:#da746a;stroke-width:20px;stroke-linecap:round;stroke-linejoin:round}
.p8-s2{fill:#f8b4aa;stroke:#da746a;stroke-width:19px;stroke-linejoin:round}
.p8-s3{fill:none;stroke:#da746a;stroke-width:20px;stroke-linecap:round}
.p8-s4{fill:#fcc0b3}.p8-s5{fill:#fde0d9}.p8-s6{fill:#371912}.p8-s7{fill:#f8aba0}.p8-s8{fill:#da746a}

.shell{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden}

.phone{width:100%;height:100%;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--canvas-bg);transition:background .3s}
@media(max-width:500px){
  .app-top{padding-top:max(12px,env(safe-area-inset-top))!important}
  .dock-wrap{padding-bottom:max(10px,env(safe-area-inset-bottom))!important}
}
.sb{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;color:var(--ink2)}
.gb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:99px;background:var(--ink);opacity:.15;pointer-events:none;z-index:40}

.os-banner{position:absolute;top:10px;left:12px;right:12px;z-index:62;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-radius:20px;padding:10px 13px;box-shadow:0 14px 32px rgba(35,45,60,.16);display:flex;align-items:center;gap:10px;transform:translateY(-150%);opacity:0;pointer-events:none;cursor:pointer;transition:transform .34s var(--jelly),opacity .2s}
.os-banner.show{transform:translateY(0);opacity:1;pointer-events:auto}
.os-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13.5px;font-weight:700;color:#fff;flex:none}

.fx-layer{position:absolute;inset:0;pointer-events:none;z-index:72;overflow:hidden}
.burst-coin{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;animation:coinFountain .74s cubic-bezier(.18,.88,.38,1) forwards}
@keyframes coinFountain{0%{opacity:1;transform:translate(0,0) scale(.5)}45%{opacity:1;transform:translate(calc(var(--dx)*.66),var(--dy)) scale(1.14) rotate(80deg)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 105px)) scale(.7) rotate(180deg)}}

.app-top{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:8px 18px 12px;flex:none;gap:10px;z-index:15}
.app-top b{font-size:23px;font-weight:800;display:block;line-height:1.2}
.comp-pill{display:inline-flex;align-items:center;gap:4px;margin-top:5px;padding:3px 9px;border-radius:99px;background:var(--card-soft);border:var(--border);font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.ibtn{width:38px;height:38px;border-radius:12px;background:var(--card);backdrop-filter:blur(var(--blur));border:var(--border);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:transform .14s var(--jelly)}
.ibtn:active{transform:scale(.9)}

.main-view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.swipe-pages,.swipe-pages .scroll-pane{touch-action:pan-y pinch-zoom}
.subpage-nav{flex:none;padding:0 16px 12px}
.subpage-nav:empty{display:none}
.subpage-nav .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:15px;padding:4px;gap:4px}
.subpage-nav .seg button{min-height:42px;border-radius:11px;font-size:14px;padding:5px;white-space:normal}
.subpage-nav button:not(.on){color:var(--ink2)}
.scroll-pane{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 16px 92px;scrollbar-width:none}
.scroll-pane::-webkit-scrollbar{display:none}
.card{background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px}
.seg{display:inline-flex;background:var(--track);border-radius:99px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:6px 10px;border-radius:99px;border:0;background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.qbtn{font:inherit;font-size:13px;font-weight:600;padding:6px 10px;border-radius:99px;border:1px solid var(--div);background:rgba(255,255,255,.88);color:var(--ink2);white-space:nowrap;cursor:pointer;transition:transform .12s}
.qbtn:active{transform:scale(.93)}.qbtn.on{background:var(--cta);color:#fff;border-color:transparent;font-weight:700}
.prog{height:8px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.prog>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--prog);transition:width .32s var(--spring)}

.hero{position:relative;height:224px;margin-top:2px}
.say{position:absolute;left:50%;top:2px;transform:translateX(-50%);width:max-content;max-width:100%;background:var(--card);border:var(--border);border-radius:18px;padding:6px 12px;font-size:13px;line-height:1.4;font-weight:600;color:var(--ink2);text-align:center;z-index:3;box-shadow:var(--shadow);overflow-wrap:anywhere}
.pig-box{position:absolute;left:50%;top:41px;transform:translateX(-50%);width:170px;height:170px;display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 10px 16px rgba(218,116,106,.14))}
.pupu-float{animation:pFloat 2.2s ease-in-out infinite alternate;transform-origin:center bottom}
@keyframes pFloat{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.orb{position:absolute;border-radius:50%;display:grid;place-items:center;box-shadow:0 5px 14px rgba(120,95,60,.09);cursor:pointer;transition:transform .15s var(--jelly)}
.orb:hover{transform:scale(1.07)}.orb small{position:absolute;bottom:-18px;font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}
.home-page,.flow-page,.insights-page{display:grid;gap:14px;min-width:0}
.home-page .sec-hd{margin-top:0;margin-bottom:8px;gap:6px}
.bento2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px}
.bento2>.card{min-width:0;padding:14px 12px}
.home-budget{display:grid;align-content:space-between;gap:7px}
.home-budget-head{display:flex;align-items:center;justify-content:space-between;gap:4px;color:var(--ink2);font-size:13px;font-weight:600}
.home-budget-edit{min-height:36px;flex:none;padding:0 4px;border:0;border-radius:9px;background:transparent;color:var(--ink2);font:inherit;font-size:12px;cursor:pointer}
.home-quota{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px;min-width:0;min-height:42px;padding:7px;border:0;border-radius:11px;background:#f5f2eb;color:var(--ink2);font:inherit;font-size:12px;text-align:left;cursor:pointer}
.home-quota b{color:var(--ink);font-size:13px;text-align:right;overflow-wrap:anywhere}
.home-quota svg{display:block;color:var(--muted)}
.home-quota:active,.home-budget-edit:active{background:#eee8dc}
.home-budget button:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
.budget-balance{font-size:clamp(19px,6.1vw,26px);font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.budget-balance.long{font-size:17px}
.home-budget-setup{min-height:36px;justify-self:start}
.home-trend-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:3px 5px;font-size:12px;font-weight:700;margin-bottom:8px}

.sec-hd{display:flex;justify-content:space-between;align-items:center;margin:13px 3px 6px}
.sec-hd b{font-size:15px;font-weight:700}.sec-hd span{font-size:13px;color:var(--ink2);cursor:pointer}
.ent{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--div);cursor:pointer}
.ent:last-child{border-bottom:0}
.ent .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
body[data-style="meditation"] .ent .ico{border-radius:50%}
.ent .m{flex:1;min-width:0}
.ent .m b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .m span{font-size:12px;color:var(--ink2);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .m b span{color:inherit;font-size:inherit;margin:0}
.ent em{font-style:normal;font-weight:700;font-size:15px;white-space:nowrap}.ent em.in{color:var(--green)}
.tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;background:rgba(245,178,64,.18);color:#8f5e14;flex:none}
.tag.auto{background:rgba(40,164,100,.13);color:#207d4c}.tag.merge{background:rgba(47,104,230,.12);color:#2958c8}

.sbox{position:relative;display:flex;align-items:center}
.sbox input{width:100%;min-width:0;min-height:46px;padding:9px 33px;border-radius:15px;border:var(--border);background:#fff;box-shadow:var(--shadow);font:inherit;font-size:14px;color:var(--ink);outline:none}
.sbox input:focus-visible{outline:2px solid #a6bdf7;outline-offset:-2px}
.sbox input::-webkit-search-cancel-button{display:none}
.search-clear{position:absolute;right:5px;min-width:27px;height:32px;border:0;background:none;color:var(--ink2);font:inherit;cursor:pointer}
.flow-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.flow-results{display:grid;gap:11px}
.flow-filter-button{min-height:46px;display:flex;align-items:center;gap:5px;border-radius:14px;padding:7px 10px;color:var(--ink2);background:var(--card)}
.flow-filter-button.on{background:#eaf0ff;color:#2559cc;border-color:#d6e2ff}
.flow-filter-button i{font-style:normal;font-size:10px}
.flow-summary{display:flex;align-items:center;flex-wrap:wrap;gap:7px 12px;font-size:13px;font-weight:650;color:var(--ink2);padding:0 3px}
.flow-summary .qbtn{margin-left:auto;color:#2958ae}
.flow-selection{line-height:1.45;overflow-wrap:anywhere}
.flow-filter-sheet{display:grid;gap:16px}
.flow-filter-sheet .backup-heading{margin:0}
.flow-filter-sheet fieldset{min-width:0;border:0}
.flow-filter-sheet legend{font-size:14px;font-weight:700;margin-bottom:8px}
.flow-filter-sheet .date-range{margin-top:9px}
.flow-filter-options{display:flex;flex-wrap:wrap;gap:7px}
.flow-filter-options .qbtn{min-height:36px;white-space:normal;max-width:100%;overflow-wrap:anywhere}
.calendar-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.calendar-head b{font-size:13px}
.calendar-month{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--ink2)}
.calendar-month .qbtn{min-width:36px;min-height:36px;display:grid;place-items:center;padding:0}
.frow{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.frow::-webkit-scrollbar{display:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;text-align:center}
.cal-c{display:grid;grid-template-rows:23px auto;justify-items:center;align-items:center;gap:1px;padding:3.5px 0;border-radius:12px;cursor:pointer;border:1px solid transparent}
.cal-c.sel{background:#fff;border-color:var(--div);box-shadow:0 3px 9px rgba(0,0,0,.05)}
.cal-c .dl{grid-row:2;font-size:12px;color:var(--ink2);font-weight:600;padding:0 5px;border-radius:99px}
.cal-c.today .dl{background:var(--cta);color:#fff}

.mine-page{display:grid;gap:17px;padding-top:2px}
.mine-hero{border-radius:24px;padding:15px 15px 5px;background:linear-gradient(140deg,#3a4b73,#2b3554);color:#fff;box-shadow:0 8px 20px rgba(43,53,84,.12)}
.mine-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mine-hero-title{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700}
.mine-hero-title svg{color:#d0ddff;flex:none}
.mine-hero .sw:not(.off){background:#3573f6}
.mine-hero .sw.off{background:#64708c!important}
.mine-status{display:flex;align-items:baseline;gap:5px;margin-top:6px;color:#e0e8fb;font-size:13px;font-weight:600;line-height:1.45}
.mine-status::before{content:"";width:6px;height:6px;flex:none;border-radius:50%;background:#b8c4df}
.mine-status.active::before{background:#86e0b5}
.mine-status.warning{color:#ffdfac}.mine-status.warning::before{background:#ffc978}
.mine-count{margin-top:10px;font-size:13px;font-weight:600;color:#e0e8fb}
.mine-count strong{font-size:29px;line-height:1;font-weight:800;color:#fff}
.mine-manage{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:8px 0;min-height:44px;border:0;border-top:1px solid #ffffff30;background:none;color:#fff;text-align:left;font:inherit;font-size:14px;font-weight:650;cursor:pointer}
.mine-manage svg{flex:none;color:#d0ddff}
.mine-manage:active{opacity:.75}
.mine-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px;margin-bottom:8px}
.mine-heading h2{font-size:15px;font-weight:750}
.mine-version{font-size:12px;color:var(--ink2)}
.mine-auto-meta{margin:8px 3px 0;font-size:12px;color:var(--ink2)}
.mine-group{padding:2px 12px;border-radius:19px}
.mine-row{display:flex;align-items:center;gap:11px;width:100%;min-height:58px;padding:9px 0;border:0;border-bottom:1px solid var(--div);background:transparent;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.mine-row:last-child{border-bottom:0}
.mine-row:active .action-copy{opacity:.72}
.mine-row .action-icon{width:37px;height:37px;border-radius:11px}
.mine-row .action-icon.sand{background:#f6ecdc;color:#8a632f}
.mine-row .action-copy small{color:var(--ink2)}
.mine-row.permission-warning .action-copy small{color:#8b5414;font-weight:650}
.mine-row-arrow{display:flex;color:var(--muted);flex:none}
.mine-back{display:flex;align-items:center;gap:9px;min-height:43px}
.mine-back .ibtn{width:38px;height:38px}

.sw{width:42px;height:24px;border-radius:99px;background:var(--green);position:relative;cursor:pointer;flex:none;transition:background .2s}

.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;right:3px;transition:all .18s var(--jelly)}
.sw.off{background:rgba(150,145,140,.3)!important}.sw.off::after{right:auto;left:3px}
.sw.pending{background:#a16615!important}
button.sw{border:0;padding:0}
.channel-row{min-height:49px;cursor:default}
.channel-row .m b{white-space:normal;overflow:visible}
.channel-row .m .channel-warning{color:#8b5414;font-weight:650;white-space:normal}
.channel-tools{display:flex;align-items:center;gap:7px;flex:none}
.channel-tools .qbtn{color:#2659c2}

.dock-wrap{position:absolute;left:0;right:0;bottom:0;padding:6px 15px 14px;pointer-events:none;z-index:30}
.dock{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;background:var(--dock);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.92);border-radius:26px;padding:5px 8px;box-shadow:0 12px 28px -6px rgba(45,40,35,.12)}
.ditem{flex:1;min-width:0;height:49px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink2);position:relative;white-space:nowrap}
.ditem.on{background:var(--dock-on);color:var(--cta);font-weight:700}
.dadd{flex:none;width:48px;height:48px;margin:0 4px;border-radius:50%;border:0;background:var(--cta);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--cta-sh)}
.ndot{position:absolute;top:5px;right:13px;width:6px;height:6px;border-radius:50%;background:var(--red)}

.mask{position:absolute;inset:0;background:rgba(28,26,24,.35);backdrop-filter:blur(4px);z-index:65;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;background:var(--canvas);border-radius:28px 28px 0 0;padding:14px 16px 24px;position:relative;overflow-y:auto;box-shadow:0 -12px 32px rgba(0,0,0,.14)}
.cta-btn{font:inherit;width:100%;min-height:44px;border-radius:99px;border:0;background:var(--cta);color:#fff;font-size:14px;font-weight:700;box-shadow:var(--cta-sh);cursor:pointer}
.cta-btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--div);box-shadow:none}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.kk{height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.04)}
.kk.ok{background:var(--cta);color:#fff;font-size:12.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(32,30,28,.92);color:#fff;font-size:12px;font-weight:600;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:all .2s var(--jelly);z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body{background:var(--canvas)}

 .sw:not(.off){background:var(--cta)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
.empty{color:var(--ink2);text-align:center;padding:14px;font-size:13px}
.edit-field{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--div);font-size:13px}
.edit-field input{min-width:0;width:60%;text-align:right;padding:5px;border:0;background:transparent;color:var(--ink);font:inherit}

/* Shared controls for ledger dates, data sources and insights. */
.action-card{width:100%;display:flex;align-items:center;text-align:left;gap:11px;padding:11px 13px;border:var(--border);border-radius:18px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);font:inherit;cursor:pointer}
.action-card:active,.date-chip:active,.date-nav:active{background:#e9efff}
.action-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#eaf0ff;color:var(--cta);flex:none}
.action-icon.mint{background:#e1f2e8;color:#287a53}
.action-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:2px}
.action-copy b{font-size:15px}
.action-copy small{color:var(--ink2);font-size:13px;line-height:1.45}
.action-arrow{font-size:19px;line-height:1;color:var(--cta)}
.date-chip{min-width:0;display:flex;align-items:center;gap:6px;border:1px solid rgba(47,104,230,.12);border-radius:14px;background:#edf2ff;color:#294b8a;font:inherit;font-size:13px;font-weight:650;padding:7px 9px;min-height:40px;cursor:pointer;text-align:left}
.date-chip svg{flex:none;color:var(--cta)}
.date-chip-label{min-width:0;flex:1;white-space:nowrap}
.date-chip small{display:block;color:#5f6e8b;font-size:12px;font-weight:550}
.date-range{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:2px 0}
.date-range .date-chip{min-height:46px}
.date-layer{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:14px;background:#29253a62}
.date-panel{width:min(100%,348px);max-height:100%;overflow:auto;background:var(--card);border-radius:25px;padding:14px 15px;box-shadow:0 14px 45px #24214038}
.date-panel-head,.date-month,.date-shortcuts,.date-footer{display:flex;align-items:center;justify-content:space-between;gap:7px}
.date-panel-head{margin-bottom:9px}
.date-panel-head h3{font-size:17px}
.date-panel-head p{font-size:11px;color:var(--muted);margin-top:3px}
.date-month{padding:5px 0}
.date-nav{border:0;border-radius:11px;min-width:34px;min-height:34px;background:#f0f3fa;color:var(--cta);font:inherit;font-size:19px;cursor:pointer}
.date-nav:disabled{opacity:.38;cursor:default}
.date-month select{color:var(--ink);border:1px solid var(--div);border-radius:9px;padding:5px;background:var(--card);font:inherit;font-size:12px;font-weight:650}
.date-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.date-weekday{color:var(--muted);font-size:10px;padding:5px 0}
.date-day{border:1px solid transparent;border-radius:10px;min-height:32px;background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.date-day.today{border-color:#cedbff;color:var(--cta)}
.date-day.chosen{background:var(--cta);color:white;font-weight:750}
.date-day:disabled{color:#a9a49a;cursor:default}
.date-footer{margin-top:12px}
.date-footer .cta-btn{flex:1}
.trend-head,.donut-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px}
.donut-head b{font-size:16px}
.donut-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:12px;margin-top:12px}
.donut-figure{position:relative;width:100%;max-width:152px;justify-self:center;aspect-ratio:1}
.donut-figure>svg{display:block;width:100%;height:100%}
.donut-label{display:flex;align-items:center;justify-content:space-between;gap:5px;flex-wrap:wrap;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.trend-series,.trend-filters,.trend-periods{display:flex;flex-wrap:wrap;gap:5px}
.trend-series button,.trend-filters button,.trend-periods button,.trend-period-button{font:inherit;font-size:13px;font-weight:700;padding:7px 8px;min-height:36px;border:1px solid var(--div);border-radius:12px;background:white;color:var(--ink2);cursor:pointer}
.trend-series button{display:flex;align-items:center;gap:5px;white-space:nowrap}
.trend-series button[aria-pressed=true]{border-color:var(--series);color:var(--series);background:#f9fafc}
.trend-series i{width:6px;height:6px;border-radius:50%;background:var(--series);display:inline-block}
.trend-series button[aria-pressed=false] i{background:#b7b1aa}
.trend-period-button{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;background:#f0f3fa;color:#294b8a}
.trend-period-button svg{flex:none;opacity:.8}
.trend-period-title{font-size:16px;margin-bottom:10px}
.trend-periods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:10px}
.trend-periods button{font-size:13px;min-height:38px}
.trend-periods button.on{background:#eaf0ff;color:#2559cc;border-color:#d6e2ff}
.trend-range-apply{margin-top:10px}
.trend-filters{margin-top:10px;gap:8px}
.trend-filters button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.trend-filters button.on{color:#2559cc;background:#eaf0ff}
.trend-detail{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px 9px;margin-top:11px;padding:9px 10px;border-radius:12px;background:#f6f4f0;font-size:13px}
.trend-period-readout,.trend-values{display:flex;align-items:center;flex-wrap:wrap;gap:5px 7px}
.trend-period-readout small{display:block;color:var(--ink2);font-size:12px;margin-top:1px}
.trend-values span{white-space:nowrap}
.category-options{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.category-options .qbtn{min-height:33px}

.backup-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.backup-heading h3{font-size:17px}
.backup-heading .ibtn{font:inherit;font-size:20px}
.backup-actions,.dav-form{display:grid;gap:8px;margin-top:12px}
.backup-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dav-form label{display:grid;gap:4px;font-size:12px;font-weight:650}
.dav-form input{width:100%;padding:9px 10px;border:1px solid var(--div);border-radius:12px;background:white;color:var(--ink);font:inherit}
.dav-password{position:relative;display:block;min-width:0}
.dav-password input{color:transparent;-webkit-text-fill-color:transparent;caret-color:#252525;text-shadow:none}
.dav-password input::selection{color:transparent;-webkit-text-fill-color:transparent}
.dav-password-mask{position:absolute;inset:1px 11px;display:flex;align-items:center;overflow:hidden;white-space:pre;color:#202020;pointer-events:none}
.dav-password-mask span{flex:none}
.dav-help,.dav-status,.dav-confirm p{font-size:11px;line-height:1.5}
.dav-help{color:var(--muted)}
.dav-status{color:var(--cta)}
.dav-status:empty{display:none}
.dav-status.error{color:#a83c34}
.dav-confirm{background:#fffcf5;border:1px solid var(--div);border-radius:14px;padding:9px}
.dav-confirm p{margin-bottom:8px}
.cta-btn:disabled{opacity:.45;cursor:default}
.updates-body{display:grid;gap:9px;margin-top:12px}
.update-summary{display:grid;gap:4px;padding:12px 14px;border-radius:16px;background:var(--track)}
.update-summary b{font-size:14px}.update-summary p,.update-caption,.release-date{font-size:11px;color:var(--muted);line-height:1.5}
.update-caption.error{color:#a83c34}
.release-entry{background:var(--card);border:var(--border);border-radius:16px;padding:10px 12px}
.release-entry summary{cursor:pointer;font-size:13px;font-weight:700;overflow-wrap:anywhere}
.release-date{display:block;font-weight:500;margin:3px 0 0 15px}
.release-notes{margin:8px 0;color:var(--ink2);font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.update-links{display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:11px}
.update-links button{min-height:36px;padding:0 3px;background:none;border:0;color:var(--cta);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.ledger-empty{display:flex;align-items:center;gap:13px;padding:15px 13px;min-height:100px}
.ledger-empty-art{flex:none;width:60px;height:60px;display:grid;place-items:center;border-radius:21px;background:radial-gradient(circle at 35% 25%,#fff6e4,#fde8e0 75%)}
.ledger-empty-copy{min-width:0;display:grid;justify-items:start;gap:4px}
.ledger-empty-copy b{font-size:15px}.ledger-empty-copy p{font-size:13px;color:var(--ink2);line-height:1.5}
.ledger-empty-copy button{margin-top:3px;min-height:35px;background:#edf2ff;color:#2958ae;border:0}
.budget-periods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:10px 0}
.budget-periods button{min-height:34px;padding-inline:3px}
.budget-card{display:grid;gap:8px;padding:12px 14px;background:var(--card);border:var(--border);border-radius:16px;margin-bottom:10px}
.budget-card small{font-size:13px;color:var(--ink2);line-height:1.5}
.budget-card input{width:100%;padding:7px 10px;color:var(--ink);background:var(--canvas);border:var(--border);border-radius:10px;font:inherit;font-size:16px}
.channel-recovery{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;margin:0 0 7px;border-radius:13px;background:#fff2d9;color:#7c5419;font-size:11.5px;line-height:1.4}
.worth-empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:21px 18px 23px}
.worth-empty-art{display:grid;place-items:center;width:124px;height:124px;background:radial-gradient(circle at 36% 26%,#fff6e4,#fde8e0 74%);border-radius:42px}
.worth-empty h3{font-size:18px}.worth-empty p{font-size:14px;color:var(--ink2);line-height:1.55;max-width:265px}
.worth-empty .cta-btn{margin-top:5px;max-width:200px}
.quota-details{display:grid;gap:8px;margin:10px 0 12px}
.quota-rows{padding:2px 12px;border-radius:14px;background:var(--card);border:var(--border)}
.quota-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 9px;padding:9px 0;font-size:14px}
.quota-row+.quota-row{border-top:1px solid var(--div)}.quota-row dt{color:var(--ink2)}.quota-row dd{margin-left:auto;font-weight:700;text-align:right;overflow-wrap:anywhere}
.quota-note{font-size:13px;color:var(--ink2);line-height:1.5}
</style>
</head>

  for(const key of ['firstMetDate','budgetLimits','autoGuard','channels','stamps','rules']){
    if(JSON.stringify(S[key])!==JSON.stringify(baseline[key])) settings[key]=S[key];
  }
  if(!changed.length&&!deleted.length&&!Object.keys(settings).length)return true;
  const error=Ledger.apply(JSON.stringify({changed,deleted,settings}));
  syncLedger();
  if(error){toast(error);return false;}
  return true;
}

/* ==================== 1. 陪伴纪念系统（相识第几天 & 已使用多少天） ==================== */
function getCompanionStats(){
  const t0 = new Date((S.firstMetDate||TODAY)+'T00:00:00'), t1 = new Date(TODAY+'T00:00:00');
  const metDays = Math.max(1, Math.floor((t1 - t0)/86400000) + 1);
  const usedDays = new Set(S.txns.filter(t=>t.status!=='已忽略').map(t=>t.date)).size;
  return { metDays, usedDays };
}

function dayStat(dateStr){
  let out=0, inc=0;
  S.txns.forEach(t=>{
    if(t.date===dateStr && t.status!=='已忽略'){
      if(t.dir==='支出') out+=t.cents;
      else if(t.dir==='退款') out-=t.cents;
      else if(t.dir==='收入') inc+=t.cents;
    }
  });
  return { out:Math.max(0,out), inc, net:inc-Math.max(0,out) };
}
function getQuota(){return S.quota;}
function hasBudget(){return Object.values(S.budgetLimits).some(amount=>amount>0);}
function hasRecordedDay(date){
  return date<=TODAY && S.txns.some(t=>t.date===date && t.status==='已入账');
}
function dayStamp(date,size){
  return hasRecordedDay(date)?stp(getMood(date),size):'';
}
function getMood(date){
  if(S.stamps[date])return S.stamps[date];
  const out=dayStat(date).out, quota=S.quotas[date];
  if(date===TODAY&&!hasBudget()&&out>0)return 'ok';
  const q=quota == null ? getQuota() : quota;
  return out<=q*.8?'happy':out<=q?'ok':'sad';
}
function shiftMonth(offset){
  const d=new Date(S.calMonth+'-01T12:00:00');
  d.setMonth(d.getMonth()+offset);
  S.calMonth=dateKey(d).slice(0,7);
  S.selDay=S.calMonth===MONTH?TDAY:1;
  render();
}
function stampDay(date,mood){
  if(!hasRecordedDay(date))return;
  S.stamps[date]=mood;
  if(save()){
    const stamp=document.querySelector('.cal-c.sel svg');
    if(stamp)stamp.animate([{transform:'scale(1.4) rotate(-9deg)'},{transform:'scale(.82)'},{transform:'scale(1)'}],{duration:260});
    toast('已盖章');

}

const SWIPE_PAGES={cal:['calSub','cal','list'],stats:['statsSub','overview','worth']};
const SUBPAGE_LABELS={cal:['印章日历','账单流水'],stats:['趋势与圆环','这笔值不值']};
function switchSubpage(tab,index){
  if(S.tab!==tab)return;
  const [key,...pages]=SWIPE_PAGES[tab];
  const direction=index-pages.indexOf(S[key]);
  if(!direction||index<0||index>=pages.length)return;
  S[key]=pages[index];
  slideView(direction);
}
function bindSubpageSwipe(){
  const surface=document.getElementById('main-view');
  let gesture=null, suppressClick=false;
  const blocked=()=>['sheet-root','date-root'].some(id=>document.getElementById(id).childElementCount);
  surface.addEventListener('pointerdown',event=>{
    gesture=null;
    if(!event.isPrimary)return;
    suppressClick=false;
    if(event.pointerType!=='touch'||!SWIPE_PAGES[S.tab]||blocked())return;
    if(event.target.closest('input,textarea,select,[contenteditable]'))return;
    const [key,...pages]=SWIPE_PAGES[S.tab];
    gesture={id:event.pointerId,tab:S.tab,index:pages.indexOf(S[key]),x:event.clientX,y:event.clientY,horizontal:false};
  });
  surface.addEventListener('pointermove',event=>{
    if(gesture?.id!==event.pointerId||gesture.horizontal)return;
    const dx=Math.abs(event.clientX-gesture.x),dy=Math.abs(event.clientY-gesture.y);
    if(dy>=10&&dy>dx){gesture=null;return;}
    if(dx<9||dx<dy*1.2)return;
    gesture.horizontal=true;
    suppressClick=true;
    surface.setPointerCapture(event.pointerId);
  });
  surface.addEventListener('pointerup',event=>{
    if(gesture?.id!==event.pointerId)return;
    const {x,y,tab,index}=gesture;
    gesture=null;
    if(S.tab!==tab||blocked())return;
    const dx=event.clientX-x,dy=event.clientY-y;
    const threshold=Math.max(32,Math.min(52,surface.clientWidth*.11));
    if(Math.abs(dx)<threshold||Math.abs(dx)<Math.abs(dy)*1.25)return;
    const [key,...pages]=SWIPE_PAGES[tab];
    if(pages.indexOf(S[key])!==index)return;
    suppressClick=true;
    switchSubpage(tab,index+(dx<0?1:-1));
  });
  surface.addEventListener('pointercancel',()=>{gesture=null;});
  surface.addEventListener('click',event=>{
    if(!suppressClick||event.detail===0)return;
    suppressClick=false;
    event.preventDefault();
    event.stopImmediatePropagation();
  },true);
}

  }
  if(period==='month')return [monthStart(TODAY,-12),TODAY];
  if(period==='quarter'){

    return [monthStart(TODAY,-offset-3*7),TODAY];

  const earliest=S.txns.reduce((first,t)=>t.status==='已入账'&&t.date>=MIN_DATE&&t.date<first?t.date:first,TODAY);
  const year=Math.min(Number(TODAY.slice(0,4))-3,Number(earliest.slice(0,4)));
  return [year+'-01-01',TODAY];
}

function trendData(from,to,period){
  const duration=Math.round((Date.parse(to)-Date.parse(from))/86400000)+1;
  const unit=period==='custom'?(duration<=31?'day':duration<=217?'week':duration<=1100?'month':'year'):period;
  const bins=[];
  for(let date=from;date<=to;){
    const month=Number(date.slice(5,7)), year=date.slice(0,4);
    let next=shiftDay(date,1);
    let label=date.slice(0,7)===to.slice(0,7)&&from.slice(0,7)===to.slice(0,7)?Number(date.slice(8))+'日':date.slice(5).replace('-','/');
    let periodName='';
    if(unit==='week'){
      const weekday=(new Date(date+'T12:00:00').getDay()+6)%7;
      next=shiftDay(date,7-weekday);
      label=date.slice(5).replace('-','/');
    }else if(unit==='month'){
      next=monthStart(date,1);
      label=(date===from||month===1?year+'·':'')+month+'月';
      periodName=year+'年'+month+'月';
    }else if(unit==='quarter'){
      const quarter=Math.floor((month-1)/3)+1;
      next=monthStart(date,3-(month-1)%3);
      label=(date===from||quarter===1?year+'·':'')+quarter+'季';
      periodName=year+'年第'+quarter+'季度';
    }else if(unit==='year'){
      next=String(Number(year)+1)+'-01-01';
      label=year;
      periodName=year+'年';
    }
    const end=next<=to?shiftDay(next,-1):to;
    const rangeLabel=dateLabel(date)+(end===date?'':' – '+dateLabel(end));
    bins.push({key:date,end,label,periodName,rangeLabel,out:0,inc:0,net:0});
    date=next;
  }
  const byId=new Map(S.txns.map(t=>[t.id,t]));
  const records=[];
  for(const txn of S.txns){
    if(txn.status!=='已入账'||txn.date<from||txn.date>to)continue;
    if(!['支出','收入','退款'].includes(txn.dir))continue;
    const side=txn.dir==='收入'?'收入':'支出';
    const category=txn.dir==='退款'?(byId.get(txn.refundOf)||txn).category:txn.category;
    const chosen=S.trendCategories[side];
    if(chosen.length&&!chosen.includes(category))continue;
    const bucket=bins.find(b=>txn.date>=b.key&&txn.date<=b.end);
    if(!bucket)continue;
    if(txn.dir==='收入')bucket.inc+=txn.cents;
    else bucket.out+=txn.dir==='退款'?-txn.cents:txn.cents;
    records.push(txn);
  }
  bins.forEach(b=>{b.net=b.inc-b.out;});
  return {bins,records};
}
function renderTrendChart(bins,selected,hasRecords){
  const width=320,plotHeight=132,left=13,right=13,top=9,bottom=20;
  const showYears=bins.some(bin=>bin.label.includes('·'));
  const height=plotHeight+(showYears?12:0);
  const visible=TREND_SERIES.filter(([key])=>S.trendSeries.includes(key));
  let min=0,max=0;
  for(const bin of bins)for(const [key] of visible){
    min=Math.min(min,bin[key]);max=Math.max(max,bin[key]);
  }
  if(min===max)max+=100;
  const step=(width-left-right)/Math.max(1,bins.length-1);
  const x=i=>bins.length===1?width/2:left+i*step;
  const y=value=>top+(max-value)/(max-min)*(plotHeight-top-bottom);
  const selectedIndex=bins.indexOf(selected);
  const fills=visible.map(([key,,color])=>{
    const points=bins.map((bin,i)=>x(i)+','+y(bin[key])).join(' ');
    return `<polygon points="${x(0)},${y(0)} ${points} ${x(bins.length-1)},${y(0)}" fill="${color}" opacity="${visible.length===1 ? .12 : .045}"/>`;
  }).join('');
  const lines=visible.map(([key,,color])=>{
    const points=bins.map((bin,i)=>x(i)+','+y(bin[key])).join(' ');
    const dots=bins.map((bin,i)=>{
      if(i===selectedIndex)return `<circle cx="${x(i)}" cy="${y(bin[key])}" r="4" fill="white" stroke="${color}" stroke-width="1.8"/>`;
      if(bins.length>31 && i%Math.ceil(bins.length/31)!==0)return '';
      return `<circle cx="${x(i)}" cy="${y(bin[key])}" r="2.55" fill="${color}"/>`;
    }).join('');
    return `<polyline data-series="${key}" points="${points}" fill="none" stroke="${color}" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  const every=Math.max(1,Math.ceil(bins.length/7));
  const placed=[[],[]];
  function axisText(value,row,i){
    if(!value)return '';
    const labelWidth=Array.from(value).reduce((total,char)=>total+(/[0-9.\\/]/.test(char)?6.8:11),0);
    const center=Math.min(width-2-labelWidth/2,Math.max(2+labelWidth/2,x(i)));
    const start=center-labelWidth/2,end=center+labelWidth/2;
    if(placed[row].some(([left,right])=>start<right+5&&end>left-5))return '';
    placed[row].push([start,end]);
    return `<text x="${center}" y="${plotHeight-7+row*12}" text-anchor="middle" font-size="${row===0?11:9.5}" fill="var(--ink2)">${esc(value)}</text>`;
  }
  const candidates=[0];
  if(bins.length>1)candidates.push(bins.length-1);
  for(let i=every;i<bins.length-1;i+=every)candidates.push(i);
  const labels=candidates.map(i=>{
    const parts=bins[i].label.split('·');
    const year=parts.length===2?parts[0]:'';
    return axisText(parts[parts.length-1],0,i)+axisText(year,1,i);
  }).join('');
  const targets=bins.map((b,i)=>{
    const start=i===0?0:x(i)-step/2;
    const end=i===bins.length-1?width:x(i)+step/2;
    return `<rect x="${start}" y="0" width="${end-start}" height="${height}" fill="transparent" onclick="S.trendSelected='${b.key}';render()"/>`;
  }).join('');
  const hint=!visible.length?'曲线已隐藏':!hasRecords?'该范围暂无账单':'';
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="收支趋势图" style="display:block;width:100%;height:auto;margin-top:10px;overflow:visible">
    <line x1="${left}" y1="${y(0)}" x2="${width-right}" y2="${y(0)}" stroke="var(--div)" stroke-dasharray="4 3"/>
    ${fills}${lines}${labels}
    ${hint?`<text x="${width/2}" y="${height/2}" text-anchor="middle" font-size="12" fill="var(--ink2)">${hint}</text>`:''}
    ${targets}
  </svg>`;
}

      </div>`;
  }

  const [from,to]=trendBounds();
  const {bins,records}=trendData(from,to,S.trendPeriod);
  const selected=bins.find(b=>b.key===S.trendSelected) || bins[bins.length-1];
  const periodLabel=TREND_PERIODS.find(([key])=>key===S.trendPeriod)[1];
  const dMode = S.donutMode || '支出';
  const dTxns = records.filter(t=>t.dir===dMode);
  const dTotal = dTxns.reduce((a,t)=>a+t.cents, 0);

  const catArr = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  let a0 = -Math.PI/2, arcs = '';
  const R1 = 68, R0 = 44, cx = 76, cy = 76;
  catArr.forEach(([c, val])=>{
    const sw = (val / Math.max(1, dTotal)) * Math.PI * 2;
    const a1 = a0 + (sw >= Math.PI*2 ? Math.PI*1.999 : sw);
    const lg = sw > Math.PI ? 1 : 0;
    const pt = (r,a) => `${(cx + r*Math.cos(a)).toFixed(1)} ${(cy + r*Math.sin(a)).toFixed(1)}`;
    arcs += `<path d="M${pt(R1,a0)} A${R1} ${R1} 0 ${lg} 1 ${pt(R1,a1)} L${pt(R0,a1)} A${R0} ${R0} 0 ${lg} 0 ${pt(R0,a0)} Z" fill="${CCOL[c]||'#e05a50'}" stroke="#fff" stroke-width="2" style="cursor:pointer" onclick="jumpTrendCategory(${arg(c)},${arg(dMode)})"/>`;
    a0 += sw;
  });

  return `<div class="insights-page">

    <div class="card">
      <div class="trend-head">

        </div>

      </div>
      <div class="trend-filters">${trendCategoryButton('支出')}${trendCategoryButton('收入')}</div>
      <div class="trend-detail">
        <div class="trend-period-readout">
          ${selected.key===selected.end?dayStamp(selected.key,19):''}
          <span>${selected.periodName?`<b>${selected.periodName}</b><small>${selected.rangeLabel}</small>`:`<b>${selected.rangeLabel}</b>`}</span>
        </div>
        <div class="trend-values num">
          ${TREND_SERIES.map(([key,label,color])=>`<span>${key==='out'?'支':key==='inc'?'收':'余'} <b style="color:${color}">¥${fmt(selected[key])}</b></span>`).join('')}
        </div>
      </div>
      ${renderTrendChart(bins,selected,records.length>0)}
    </div>

    <!-- 2. 支出 / 收入 双模式圆环图卡片 -->
    <div class="card">
      <div class="donut-head">
        <b>${dMode}构成</b>
        <div class="seg">
          <button class="${dMode==='支出'?'on':''}" onclick="S.donutMode='支出';render()">支出</button>
          <button class="${dMode==='收入'?'on':''}" onclick="S.donutMode='收入';render()">收入</button>
        </div>
      </div>

      <div class="donut-body">
        <div class="donut-figure">
          <svg width="152" height="152" viewBox="0 0 152 152">${arcs||'<circle cx="76" cy="76" r="56" fill="none" stroke="#eeeae4" stroke-width="24"/>'}</svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
            ${stp(hasRecordedDay(TODAY)?getMood(TODAY):'happy',34)}
            <b class="num" style="font-size:14px;font-weight:800;margin-top:2px">¥${fmtS(dTotal)}</b>
            <span style="font-size:12px;color:var(--ink2)">总${dMode}</span>
          </div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:7px;min-width:0">
          ${catArr.length?'':'<p class="empty">暂无分类数据</p>'}
          ${catArr.map(([c, val])=>{
            const pct = Math.round((val/Math.max(1,dTotal))*100);
            return `<div onclick="jumpTrendCategory(${arg(c)},${arg(dMode)})" style="cursor:pointer">
              <div class="donut-label">
                <span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CCOL[c]||'#978a7a'};margin-right:4px"></i>${esc(c)} <small style="color:var(--muted)">${pct}%</small></span>
                <b class="num">¥${fmtS(val)}</b>
              </div>
              <div class="prog" style="height:5px;margin-top:3px"><i style="width:${pct}%;background:${CCOL[c]||'#978a7a'}"></i></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div></div>`;
}

const bundledRelease={tag:'v0.3.26',title:'空叶记账 v0.3.26',notes:'- 调整主页面的字号、图标和按钮尺寸。\n- 重做首页日额度入口，点整行可查看计算明细。'};
let githubCatalog=null, updateBusy=false, updateError='';
const versionLabel=version=>version?'v'+version.replace(/^v/,''):'未知版本';
function openUpdateSheet(tab,refresh=false){
  document.getElementById('sheet-root').innerHTML=`<div class="mask" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="版本与更新">
    <div class="backup-heading"><h3>版本与更新</h3><button class="ibtn" aria-label="关闭版本与更新" onclick="closeSheet()">×</button></div>
    <div class="seg">
      <button class="${tab==='check'?'on':''}" aria-pressed="${tab==='check'}" onclick="openUpdateSheet('check')">检查更新</button>
      <button class="${tab==='history'?'on':''}" aria-pressed="${tab==='history'}" onclick="openUpdateSheet('history')">更新历史</button>
    </div>
    <div id="updates-body" class="updates-body" data-tab="${tab}"></div>
    <div class="update-links">
      <button onclick="Ledger.openGitHub('repository','')">GitHub 仓库 ↗</button>
      <button onclick="Ledger.openGitHub('releases','')">GitHub 发布页 ↗</button>
    </div>
  </section></div>`;
  renderUpdateBody();
  if(refresh) requestUpdateCheck();
}
function requestUpdateCheck(){
  if(updateBusy)return;
  updateBusy=true;
  updateError='';
  renderUpdateBody();
  Ledger.checkUpdates();
}
function finishUpdateCheck(result){
  updateBusy=false;
  const data=JSON.parse(result);
  updateError=data.error||'';
  if(!updateError) githubCatalog=data;
  renderUpdateBody();
}
function renderUpdateBody(){
  const body=document.getElementById('updates-body');
  if(!body)return;
  const current=versionLabel(Ledger.appVersion());
  const latest=githubCatalog?.releases[0];
  const retry=`<button class="cta-btn ghost" onclick="requestUpdateCheck()" ${updateBusy?'disabled':''}>${updateBusy?'正在检查…':updateError?'重试':'重新检查'}</button>`;
  if(body.dataset.tab==='check'){
    const available=!updateBusy&&!updateError&&latest&&githubCatalog.comparison>0;
    let status='查看 GitHub 上的公开版本';
    if(updateBusy) status='正在检查 GitHub 更新…';
    else if(updateError) status=updateError;
    else if(available) status=`发现新版 ${versionLabel(latest.tag)}`;
    else if(latest&&githubCatalog.comparison===0) status='当前已是最新版本';
    else if(latest&&githubCatalog.comparison<0) status='暂无可安装的更新';
    else if(githubCatalog) status='暂无可比较的公开版本';
    body.innerHTML=`<div class="update-summary" role="status">
      <b>${esc(status)}</b><p>已安装 ${esc(current)}${latest?` · ${updateBusy||updateError?'上次查到':'GitHub 最新'} ${esc(versionLabel(latest.tag))}`:''}</p>
    </div>
    ${available?`<button class="cta-btn" onclick="Ledger.openGitHub('${latest.hasApk?'apk':'release'}',${arg(latest.tag)})">${latest.hasApk?'前往 GitHub 下载 APK':'查看新版发布'}</button>`:''}
    ${retry}`;
    return;
  }
  const releases=[...(githubCatalog?.releases||[])];
  if(!releases.some(entry=>versionLabel(entry.tag)===bundledRelease.tag)) releases.push(bundledRelease);
  releases.sort((a,b)=>versionLabel(b.tag).localeCompare(versionLabel(a.tag),'en',{numeric:true}));
  body.innerHTML=`${updateBusy||updateError?`<p class="update-caption ${updateError?'error':''}" role="status">${esc(updateError||'正在获取 GitHub 发布记录…')}</p>`:''}
    ${releases.map((entry,index)=>`<details class="release-entry" ${index===0?'open':''}>
      <summary>${esc(entry.title)}<span class="release-date">${esc([entry.date,versionLabel(entry.tag)===current?'当前版本':'',entry.github?'GitHub 发布':'随应用提供'].filter(Boolean).join(' · '))}</span></summary>
      <div class="release-notes">${esc((entry.notes||'暂无版本说明').trim().replace(/^[-*]\s+/gm,'• '))}</div>
      ${entry.github?`<div class="update-links"><button onclick="Ledger.openGitHub('release',${arg(entry.tag)})">查看 GitHub 发布 ↗</button>
      ${entry.hasApk?`<button onclick="Ledger.openGitHub('apk',${arg(entry.tag)})">下载 APK ↗</button>`:''}</div>`:''}
    </details>`).join('')}${updateError?retry:''}`;
}

/* ==================== 自动记账解析与模拟场景 ==================== */
const LISTENING_CHANNELS=[
  ['wechat','微信支付通知'],['alipay','支付宝通知'],
  ['sms','银行动账短信'],['unionpay','云闪付通知']
];
let listenerReconnecting=false;
function setListenerReconnect(active){listenerReconnecting=active;if(S.tab==='auto')render();}
function listenerSummary(){
  if(!S.autoGuard)return '已暂停自动监听';
  if(!LISTENING_CHANNELS.some(([channel])=>S.channels[channel]))return '尚未开启任何监听渠道';
  const notifications=notificationListeningState()==='active';
  const sms=listeningState('sms')==='active';
  return notifications?(sms?'通知与短信均在监听':'正在监听支付通知'):sms?'仅在监听银行短信':'暂无正常监听的渠道';
}
function notificationListeningState(){
  const entry=LISTENING_CHANNELS.find(([channel])=>channel!=='sms'&&S.channels[channel]);
  return entry?listeningState(entry[0]):'off';
}
function listenerWarning(){
  if(!S.autoGuard)return '';
  const notificationState=notificationListeningState();
  const notificationWarning={
    permission:'通知待授权',disabled:'通知监听已停用',
    disconnected:listenerReconnecting?'通知监听连接中':'通知监听未连接'
  }[notificationState];
  const smsWarning={permission:'短信待授权',partial:'短信权限不完整'}[listeningState('sms')];
  return [notificationWarning,smsWarning].filter(Boolean).join(' · ');
}
function renderListeningSettings(){
  const mergeCount=S.txns.filter(t=>t.merged).length;
  return `<div class="mine-page">
    <section aria-labelledby="mine-channels-title">
      <div class="mine-heading"><h2 id="mine-channels-title">监听渠道</h2></div>
      ${renderListenerRecovery()}
      <div class="card mine-group">${LISTENING_CHANNELS.map(renderListeningChannel).join('')}</div>
      <p class="mine-auto-meta">已合并 ${mergeCount} 笔重复通知 · ${Object.keys(S.rules).length} 条商户规则</p>
    </section>
    <section aria-labelledby="mine-permissions-title">
      <div class="mine-heading"><h2 id="mine-permissions-title">系统权限与后台运行</h2></div>
      <div class="card mine-group">${renderLedgerPermissions()}</div>
    </section>
  </div>`;
}
function renderListenerRecovery(){
  const state=notificationListeningState();
  const description={permission:'支付通知需要开启通知读取权。',disabled:'支付通知的监听已停用。',disconnected:'支付通知的监听尚未连接。'}[state];
  if(!description)return '';
  const [label,action]=state==='permission'?['去授权','notification']:['重新连接','notification-retry'];
  const reconnecting=listenerReconnecting&&state!=='permission';
  return `<div class="channel-recovery"><span role="status">${reconnecting?'正在等待系统连接通知监听…':description}</span>
    <button class="qbtn" onclick="Ledger.configure('${action}')" ${reconnecting?'disabled':''}>${reconnecting?'连接中…':label}</button></div>`;
}
function renderLedgerPermissions(){
  const {notification,sms,reminders,battery}=S.permissions||{};
  const reminderStatus={
    active:'已授权',off:'记账提醒已关闭，点击启用',
    permission:'未授权，无法发送记账提醒',
    'channel-blocked':'系统已关闭记账提醒通知类别，点击设置'
  }[reminders]||'查看记账提醒权限';
  return [
    mineRow('bell','通知读取权',notification?'已授权':'未授权，无法监听付款通知',"Ledger.configure('notification')",'',!notification),
    mineRow('message','短信权限',sms==='active'?'已授权':sms==='partial'?'短信权限不完整，点击授权':'未授权，无法读取银行动账短信',"Ledger.configure('sms')",'',sms!=='active'),
    mineRow('cal','记账提醒',reminderStatus,"Ledger.configure('reminders')","sand",reminders!=='active'),
    mineRow('battery','后台运行',battery?'已设为不限制':'电池优化开启，后台监听可能中断',"Ledger.configure('battery')","mint",!battery)
  ].join('');
}
function listeningState(channel){
  return (S.channelStatuses||{})[channel]||'off';
}
function channelHint(channel,state){
  return {
    active:'正在监听',off:'已关闭',paused:'自动记账总开关已暂停',
    permission:channel==='sms'?'未授权短信权限':'未开启通知读取权',
    partial:'短信权限不完整',disabled:'通知监听已停用',disconnected:listenerReconnecting?'正在重新连接':'已授权，通知监听未连接'
  }[state];
}
function channelAction(channel,state){
  if(channel==='sms' && (state==='permission'||state==='partial'))return ['去授权','sms'];
  if(state==='permission')return ['去授权','notification'];
  if(state==='disconnected'||state==='disabled')return ['重试','notification-retry'];
  return null;
}
function renderListeningChannel([channel,name]){
  const state=listeningState(channel), action=channelAction(channel,state);
  const enabled=Boolean(S.channels[channel]), pending=enabled&&S.autoGuard&&state!=='active';
  return `<div class="ent channel-row">
    <div class="m"><b>${name}</b><span class="${pending?'channel-warning':''}" role="status">${channelHint(channel,state)}</span></div>
    <div class="channel-tools">
      ${channel==='sms'&&action?`<button class="qbtn" onclick="Ledger.configure('${action[1]}')" aria-label="${name} ${action[0]}">${action[0]}</button>`:''}
      <button class="sw ${pending?'pending':enabled?'':'off'}" role="switch" aria-checked="${enabled}" aria-label="${name}" onclick="toggleChannel('${channel}')"></button>
    </div>
  </div>`;
}
function toggleChannel(channel){
  S.channels[channel]=!S.channels[channel];
  const enabled=S.channels[channel];
  if(!save()||!enabled)return;
  const state=listeningState(channel);
  if(state==='active')return;
  toast(channelHint(channel,state));
  const action=channelAction(channel,state);
  if(action)Ledger.configure(action[1]);
}

    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:9px 12px;border-radius:14px;background:#fff;border:var(--border);font-size:12px">
      <span style="font-weight:600">📅 与噗噗初遇日期</span>
      ${dateButton(S.firstMetDate,'openCompanionDate()')}
    </div>
    <div style="margin-top:14px">
      <button class="cta-btn ghost" onclick="closeSheet()">收起</button>
    </div>
  </div></div>`;
}

let davBusy=false;
function openBackupSheet(tab='local'){
  document.getElementById('sheet-root').innerHTML=`<div class="mask" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="备份与恢复">
    <div class="backup-heading">
      <h3>备份与恢复</h3>
      <button class="ibtn" aria-label="关闭备份" onclick="closeSheet()">×</button>
    </div>
    <div class="seg">
      <button class="${tab==='local'?'on':''}" onclick="openBackupSheet('local')">本地备份</button>
      <button class="${tab==='webdav'?'on':''}" onclick="openBackupSheet('webdav')">WebDAV 备份</button>
    </div>
    ${tab==='local'?`
      <div class="backup-actions">
        <button class="cta-btn" onclick="exportJsonBackup()">导出 JSON 备份</button>
        <button class="cta-btn ghost" onclick="Ledger.importFile('json')">从 JSON 恢复账本</button>
        <div class="backup-columns">
          <button class="cta-btn ghost" onclick="exportCsvFile()">导出 CSV 表格</button>
          <button class="cta-btn ghost" onclick="Ledger.importFile('csv')">导入 CSV 账单</button>
        </div>
      </div>`:`
      <form class="dav-form" id="dav-form" onsubmit="return false" autocomplete="off">
        <label>服务器目录<input id="dav-address" type="url" inputmode="url" placeholder="https://示例地址/dav/账本/" oninput="renderDavPassword()"></label>
        <div class="backup-columns">
          <label>用户名<input id="dav-user" type="text" autocapitalize="off" oninput="renderDavPassword()"></label>
          <label>密码或应用密码
            <span class="dav-password" dir="ltr">
              <input id="dav-pass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="dav-help"
                oninput="this.dataset.edited='true';renderDavPassword()" onchange="renderDavPassword()" onfocus="renderDavPassword()" onscroll="scrollDavPassword(this)">
              <span class="dav-password-mask" id="dav-password-mask" aria-hidden="true"><span></span></span>
            </span>
          </label>
        </div>
        <p class="dav-help" id="dav-help">备份保存在 KongyeLedger 文件夹。操作成功后，密码会加密保存在本机。</p>
        <p class="dav-status" id="dav-status" role="status">${davBusy?'正在处理…':''}</p>
        <div class="backup-actions">
          <button type="button" class="cta-btn ghost" onclick="requestWebDav('test')">测试连接</button>
          <div class="backup-columns">
            <button type="button" class="cta-btn" onclick="confirmWebDav('upload')">上传备份</button>
            <button type="button" class="cta-btn ghost" onclick="confirmWebDav('restore')">恢复账本</button>
          </div>
        </div>
        <div id="dav-confirm"></div>
      </form>`}
  </section></div>`;
  if(tab==='webdav'){
    fillDavForm();
    updateDavControls();
  }
}
function fillDavForm(){
  const config=JSON.parse(Ledger.webDavConfig());
  const address=document.getElementById('dav-address');
  const user=document.getElementById('dav-user');
  const password=document.getElementById('dav-pass');
  address.value=address.defaultValue=config.address;
  user.value=user.defaultValue=config.user;
  password.value='';
  delete password.dataset.edited;
  password.dataset.saved=String(config.hasPassword);
  renderDavPassword();
}
function useSavedDavPassword(input){
  const address=document.getElementById('dav-address');
  const user=document.getElementById('dav-user');
  return input.dataset.saved==='true' && !input.value && !input.dataset.edited &&
    address.value.trim()===address.defaultValue && user.value.trim()===user.defaultValue;
}
function updateDavControls(){
  document.querySelectorAll('#dav-form input,#dav-form button').forEach(control=>{control.disabled=davBusy;});
}
function scrollDavPassword(input){
  const mask=document.getElementById('dav-password-mask');
  if(mask)mask.scrollLeft=input.scrollLeft;
}
function renderDavPassword(){
  const input=document.getElementById('dav-pass');
  const mask=document.getElementById('dav-password-mask');
  if(!mask)return;
  mask.firstElementChild.textContent='•'.repeat(useSavedDavPassword(input)?8:Array.from(input.value).length);
  scrollDavPassword(input);
  requestAnimationFrame(()=>scrollDavPassword(input));
}
function confirmWebDav(action){
  if(davBusy)return;
  const message=action==='upload'?'上传将替换 KongyeLedger 文件夹中上一份空叶记账备份。':'恢复会合并到本机账本。相同编号的账单和备份中包含的设置将更新。';
  document.getElementById('dav-confirm').innerHTML=`<div class="dav-confirm">
    <p>${message}</p><div class="backup-columns">
      <button type="button" class="cta-btn ghost" onclick="document.getElementById('dav-confirm').innerHTML=''">取消</button>
      <button type="button" class="cta-btn" onclick="requestWebDav('${action}')">${action==='upload'?'确认上传':'确认恢复'}</button>
    </div>
  </div>`;
}
function requestWebDav(action){
  if(davBusy)return;
  const address=document.getElementById('dav-address').value.trim();
  const user=document.getElementById('dav-user').value;
  const password=document.getElementById('dav-pass');
  const status=document.getElementById('dav-status');
  document.getElementById('dav-confirm').innerHTML='';
  if(!address){status.textContent='请填写服务器目录';status.classList.add('error');document.getElementById('dav-address').focus();return;}
  davBusy=true;
  status.textContent='正在处理…';
  status.classList.remove('error');
  updateDavControls();
  Ledger.webDav(action,address,user,password.value,useSavedDavPassword(password));
}
function finishWebDav(success,message,settingsSaved){
  davBusy=false;
  if(success)syncLedger();
  const status=document.getElementById('dav-status');
  if(!status){toast(message);return;}
  if(settingsSaved)fillDavForm();
  status.textContent=message;
  status.classList.toggle('error',!success);
  updateDavControls();
}
function exportJsonBackup(){Ledger.exportFile('json');}
function exportCsvFile(){Ledger.exportFile('csv');}
function entryCategories(direction){
  const income=['工资','兼职','理财','红包','收入'];
  return direction==='收入' ? income : [...new Set([...ALL_CATS,...S.categories])].filter(c=>!income.includes(c));
}
function openAddSheet(tab='paste',date){
  if(date)mDate=date;
  addTab = tab; renderAddSheet();
}
function openManualDate(){
  pickDate(mDate,'记账日期',date=>{
    mDate=date;
    renderAddSheet();
  });
}
function renderAddSheet(){
  const cats = entryCategories(mDir);
  if(!cats.includes(mCat)) mCat = cats[0];
  document.getElementById('sheet-root').innerHTML = `<div class="mask" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="seg">
        <button class="${addTab==='paste'?'on':''}" onclick="addTab='paste';renderAddSheet()">⚡ 粘贴短信识别</button>
        <button class="${addTab==='manual'?'on':''}" onclick="addTab='manual';renderAddSheet()">⌨️ 手动记一笔</button>
      </div>
      <span onclick="closeSheet()" style="font-size:19px;cursor:pointer;padding:0 5px">×</span>
    </div>
    ${addTab==='paste'?`
      <textarea id="sms-box" placeholder="粘贴银行动账短信或付款通知" rows="3" style="width:100%;padding:9px 11px;border-radius:14px;border:1px solid var(--div);font:inherit;font-size:12px;outline:none"></textarea>
      <button class="cta-btn" style="margin-top:8px" onclick="parsePasteSms()">识别并核对账单</button>
    `:`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px">
        <div class="seg">
          <button class="${mDir==='支出'?'on':''}" onclick="mDir='支出';renderAddSheet()">支出</button>
          <button class="${mDir==='收入'?'on':''}" onclick="mDir='收入';renderAddSheet()">收入</button>
        </div>
        ${dateButton(mDate,'openManualDate()')}
      </div>
      <div style="background:#fff;border-radius:16px;padding:9px 13px;display:flex;justify-content:space-between;align-items:baseline;border:var(--border)">
        <span style="font-size:12.5px;font-weight:700">${mDir} · ${esc(mCat)}</span>
        <b class="num" style="font-size:27px;font-weight:800;color:${mDir==='收入'?'var(--green)':'var(--ink)'}">¥ ${mAmt||'0.00'}</b>
      </div>
      <div class="frow" style="margin-top:8px">
        ${cats.map(c=>`<button class="qbtn ${mCat===c?'on':''}" onclick="mCat=${arg(c)};renderAddSheet()">${esc(c)}</button>`).join('')}
      </div>
      <input placeholder="输入商户名称或备注（选填）" value="${esc(mMer)}" oninput="mMer=this.value" style="width:100%;margin-top:7px;padding:7px 12px;border-radius:12px;border:1px solid var(--div);font:inherit;font-size:12px;outline:none"/>
      <div class="kgrid">
        ${['1','2','3','⌫','4','5','6','清空','7','8','9','0','.','确认入账'].map(k=>
          k==='确认入账'?`<div class="kk ok" style="grid-column:span 2" onclick="saveManual()">✓ 记下来</div>`:`<div class="kk num" onclick="tapK('${k}')">${k}</div>`
        ).join('')}
      </div>
    `}
  </div></div>`;
}
function parsePasteSms(){
  const txt = document.getElementById('sms-box').value;
  const result=JSON.parse(Ledger.parseMessage(txt));
  if(result.error){toast(result.error);return;}
  closeSheet();
  syncLedger();
  openEditSheet(result.id);
}
function tapK(k){
  if(k==='⌫') mAmt=mAmt.slice(0,-1); else if(k==='清空') mAmt='';
  else if(k==='.'){ if(!mAmt.includes('.')) mAmt = mAmt ? mAmt+'.' : '0.'; }
  else if((!mAmt.includes('.') || mAmt.split('.')[1].length<2) && mAmt.length<8) mAmt += k;
  renderAddSheet();
}
function saveManual(){
  const cents = moneyInput(mAmt);
  if(cents<=0){ toast('请输入大于 0 的金额'); return; }
  S.txns.unshift({id:Ledger.newId(), date:mDate||TODAY, time:new Date().toTimeString().slice(0,5), merchant:mMer.trim()||mCat, category:mCat, dir:mDir, cents, source:'手动记录', auto:false, merged:'', status:'已入账', note:'', score:-1});
  if(!save())return; mAmt=''; mMer=''; mDate=TODAY; closeSheet(); spawnCoinBurst(); render(); toast(`✓ 已记下 ${mDir} ¥${fmt(cents)}`);
}

let editCategory=null, editDate=null;
function openEditSheet(id,keepDraft=false){
  const t = S.txns.find(x=>x.id===id); if(!t) return;
  if(!keepDraft){editCategory=t.category;editDate=t.date;}
  const cats = [...new Set([t.category,...entryCategories(t.dir)])];
  document.getElementById('sheet-root').innerHTML = `<div class="mask" onclick="if(event.target===this)closeSheet()"><div class="sheet">
    <h3 style="font-size:16.5px;font-weight:800">${t.status==='待确认'?'噗噗抓到新账单，请确认分类':'账单详情与编辑'}</h3>
    <div class="num" style="font-size:32px;font-weight:800;text-align:center;margin:8px 0;color:${t.dir==='收入'?'var(--green)':'var(--ink)'}">${t.dir==='收入'?'+':'-'}¥${fmt(t.cents)}</div>
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--div);font-size:12.5px">
      <span style="color:var(--muted)">商户名称</span>
      <input id="ed-mer" value="${esc(t.merchant)}" style="border:0;background:transparent;text-align:right;font:inherit;font-weight:700;outline:none"/>
    </div>
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--div);font-size:12.5px">
      <span style="color:var(--muted)">交易日期</span>
      <span id="ed-date-control">${dateButton(editDate,'openEditDate()')}</span>
    </div>
    <label class="edit-field">金额（元） <input id="ed-amt" inputmode="decimal" value="${fmt(t.cents)}"></label>
    <label class="edit-field">备注 <input id="ed-note" value="${esc(t.note)}"></label>
    <div class="frow" style="margin-top:10px">
      ${cats.map(c=>`<button class="qbtn ${editCategory===c?'on':''}" onclick="setEditCat(${arg(t.id)},${arg(c)})">${esc(c)}</button>`).join('')}
    </div>
    <label style="display:flex;align-items:center;gap:7px;font-size:11.5px;margin-top:11px;cursor:pointer">
      <input type="checkbox" id="ed-learn" checked/> 记住规则：以后该商户自动归为「${esc(editCategory)}」
    </label>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px">
      <button class="cta-btn ghost" onclick="S.txns=S.txns.filter(x=>x.id!==${arg(t.id)});if(save()){closeSheet();toast('已删除')}">删除</button>
      <button class="cta-btn" onclick="commitEdit(${arg(t.id)})">确认保存</button>
    </div>
  </div></div>`;
}
function openEditDate(){
  pickDate(editDate,'交易日期',date=>{
    editDate=date;
    document.getElementById('ed-date-control').innerHTML=dateButton(editDate,'openEditDate()');
  });
}
function setEditCat(id,category){
  const merchant=document.getElementById('ed-mer').value;
  const amount=document.getElementById('ed-amt').value;
  const note=document.getElementById('ed-note').value;
  const learn=document.getElementById('ed-learn').checked;
  editCategory=category;
  openEditSheet(id,true);
  document.getElementById('ed-mer').value=merchant;
  document.getElementById('ed-amt').value=amount;
  document.getElementById('ed-note').value=note;
  document.getElementById('ed-learn').checked=learn;
}
function commitEdit(id){
  const t=S.txns.find(x=>x.id===id); if(!t) return;
  const mv = document.getElementById('ed-mer').value.trim(), dv = editDate;
  const amount=moneyInput(document.getElementById('ed-amt').value);
  if(!amount){toast('请输入有效金额');return;}
  t.cents=amount;
  t.note=document.getElementById('ed-note').value.trim();
  t.category=editCategory;
  if(mv) t.merchant=mv; if(dv) t.date=dv; t.status='已入账';
  if(document.getElementById('ed-learn').checked) S.rules={...S.rules,[t.merchant]:t.category};
  if(!save())return; closeSheet(); spawnCoinBurst(); render(); toast('已保存账单');
}

function moneyInput(value){
  const text=String(value).trim();
  if(!/^\d{1,10}(?:\.\d{0,2})?$/.test(text))return 0;
  return Math.round(Number(text)*100);
}
const budgetPeriods={day:'日',week:'周',month:'月',quarter:'季',year:'年'};
function openQuotaDetails(){
  const basis=S.quotaDetails;
  const spent=dayStat(TODAY).out, quota=getQuota(), available=quota-spent;
  const row=(label,value)=>`<div class="quota-row"><dt>${label}</dt><dd>${value}</dd></div>`;
  document.getElementById('sheet-root').innerHTML=`<div class="mask" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="日额度怎么算">
    <div class="backup-heading"><h3>日额度怎么算</h3><button class="ibtn" aria-label="关闭计算明细" onclick="closeSheet()">×</button></div>
    <div class="quota-details">
      ${basis?`<p class="quota-note">按当前预算和账单计算${Object.values(S.budgetLimits).filter(v=>v>0).length>1?' · 采用最紧的周期额度':''}</p><dl class="quota-rows">
        ${row(`${budgetPeriods[basis.period]}预算`,`¥${fmt(basis.limit)}`)}
        ${row('本期截至昨天的净支出',`¥${fmt(basis.earlierSpending)}`)}
        ${row('剩余天数（含今天）',`${basis.daysLeft} 天`)}
        ${row('期内余额 ÷ 剩余天数',`¥${fmt(basis.remaining)} ÷ ${basis.daysLeft} = ¥${fmt(basis.daily)}`)}
      </dl>`:''}
      <dl class="quota-rows">
        ${row('首页日额度',`¥${fmt(quota)}`)}
        ${row('减去今天净支出',`¥${fmt(spent)}`)}
        ${row(available>=0?'今天还能花':'今日超支',`¥${fmt(Math.abs(available))}`)}
      </dl>
    </div>
    <button class="cta-btn ghost" onclick="openBudgetSheet()">改预算</button>
  </section></div>`;
}
let budgetPeriod='month',budgetDraft={};
function openBudgetSheet(){
  budgetDraft=Object.fromEntries(Object.keys(budgetPeriods).map(key=>[key,S.budgetLimits[key]>0?fmt(S.budgetLimits[key]):'']));
  renderBudgetSheet();
}
function pickBudgetPeriod(period){budgetPeriod=period;renderBudgetSheet();}
function renderBudgetSheet(){
  const label=budgetPeriods[budgetPeriod];
  const used=S.budgetSpent[budgetPeriod]||0;
  const limit=moneyInput(budgetDraft[budgetPeriod]);
  document.getElementById('sheet-root').innerHTML = `<div class="mask" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="设置预算">
    <div class="backup-heading"><h3>设置预算</h3><button class="ibtn" aria-label="关闭预算" onclick="closeSheet()">×</button></div>
    <div class="budget-periods">${Object.entries(budgetPeriods).map(([key,name])=>
      `<button class="qbtn ${key===budgetPeriod?'on':''}" aria-pressed="${key===budgetPeriod}" onclick="pickBudgetPeriod('${key}')">${name}</button>`).join('')}</div>
    <div class="budget-card">
      <label for="budget-input" style="font-size:13px;font-weight:700">${label}预算（元）</label>
      <input id="budget-input" inputmode="decimal" autocomplete="off" value="${esc(budgetDraft[budgetPeriod])}" placeholder="输入金额" oninput="budgetDraft[budgetPeriod]=this.value;updateBudgetReadout()"/>
      <small id="budget-readout">${budgetReadout(used,limit)}</small>
      <small>可同时设置多个周期。首页日额度按最紧的预算计算，留空可停用本周期。</small>
    </div>
    <button class="cta-btn" onclick="commitBudget()">保存预算</button>
  </section></div>`;
}
function budgetReadout(used,limit){
  return `本期已用 ¥${fmt(used)}${limit>0?` · ${used>limit?'超出':'剩余'} ¥${fmt(Math.abs(limit-used))}`:''}`;
}
function updateBudgetReadout(){
  document.getElementById('budget-readout').textContent=budgetReadout(S.budgetSpent[budgetPeriod]||0,moneyInput(budgetDraft[budgetPeriod]));
}
function commitBudget(){
  const limits={};
  for(const period of Object.keys(budgetPeriods)){
    const value=budgetDraft[period].trim();
    if(value&&!/^\d{1,10}(?:\.\d{1,2})?$/.test(value)){
      pickBudgetPeriod(period);document.getElementById('budget-input').focus();toast('请输入有效预算金额');return;
    }
    limits[period]=moneyInput(value);
  }
  S.budgetLimits=limits;
  if(save()){closeSheet();toast('预算已保存');}
}

function finishStartup(deadline){
  if(document.getElementById('phone').offsetHeight === 0){
    if(performance.now() >= deadline) Ledger.startupFailed();
    else requestAnimationFrame(() => finishStartup(deadline));
    return;
  }
  Ledger.ready();
}

try {
  render();
  bindSubpageSwipe();
  finishStartup(performance.now() + 5000);
  const refreshDate=()=>{
    if(!document.hidden && dateKey(new Date())!==TODAY)syncLedger();
  };
  document.addEventListener('visibilitychange',refreshDate);
  setInterval(refreshDate,30000);
} catch (error) {
  Ledger.startupFailed();
}
</script>
</body>
</html>
