<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>空叶记账 · 手机演示版</title>
<style>
:root,body[data-style="meditation"]{
  --page:#ece6da;
  --canvas:#f7f3e8;
  --canvas-bg:radial-gradient(130% 48% at 50% 0%,#fdfbf6 0%,#f7f3e8 62%,#f3ede0 100%);
  --bezel:#fffdf9;
  --bezel-line:rgba(168,144,108,.22);
  --card:#ffffff;
  --card-soft:rgba(255,255,255,.84);
  --blur:10px;
  --radius:26px;
  --border:1px solid rgba(180,158,125,.11);
  --shadow:0 10px 30px -6px rgba(128,106,76,.07),0 2px 6px rgba(128,106,76,.025);
  --cta:#2f68e6;
  --cta-fg:#fff;
  --cta-sh:0 10px 22px -5px rgba(47,104,230,.36);
  --dock:rgba(255,255,255,.90);
  --dock-on:rgba(47,104,230,.10);
  --track:rgba(175,148,112,.12);
  --ink:#392e24;
  --ink2:#5e4d3d;
  --muted:#958370;
  --div:rgba(175,148,112,.13);
  --green:#28a464;
  --red:#e05a50;
  --prog:linear-gradient(90deg,#f9b4b8,#f3969b);
  --spring:cubic-bezier(.26,1.26,.48,1);
  --jelly:cubic-bezier(.34,1.52,.64,1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI",-apple-system,system-ui,sans-serif;
  background:var(--canvas);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  user-select:none;
  line-height:1.45;
  transition:background .28s ease;
}
.num{font-family:"SF Pro Rounded","Nunito","Segoe UI",ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.p8-s0{fill:none;stroke:#da746a;stroke-width:18px;stroke-linecap:round;stroke-linejoin:round}
.p8-s1{fill:none;stroke:#da746a;stroke-width:20px;stroke-linecap:round;stroke-linejoin:round}
.p8-s2{fill:#f8b4aa;stroke:#da746a;stroke-width:19px;stroke-linejoin:round}
.p8-s3{fill:none;stroke:#da746a;stroke-width:20px;stroke-linecap:round}
.p8-s4{fill:#fcc0b3}.p8-s5{fill:#fde0d9}.p8-s6{fill:#371912}.p8-s7{fill:#f8aba0}.p8-s8{fill:#da746a}

.shell{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden}
.phone{width:100%;height:100%;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--canvas-bg);transition:background .3s}
@media(max-width:500px){
  .app-top{padding-top:max(14px,env(safe-area-inset-top))!important}
  .dock-wrap{padding-bottom:max(12px,env(safe-area-inset-bottom))!important}
}
.sb{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;color:var(--ink2)}
.gb{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:99px;background:var(--ink);opacity:.15;pointer-events:none;z-index:40}

.os-banner{position:absolute;top:12px;left:16px;right:16px;z-index:62;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:12px 15px;box-shadow:0 16px 36px rgba(35,45,60,.15);display:flex;align-items:center;gap:12px;transform:translateY(-150%);opacity:0;pointer-events:none;cursor:pointer;transition:transform .34s var(--jelly),opacity .2s}
.os-banner.show{transform:translateY(0);opacity:1;pointer-events:auto}
.os-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;flex:none}

.fx-layer{position:absolute;inset:0;pointer-events:none;z-index:72;overflow:hidden}
.burst-coin{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;animation:coinFountain .74s cubic-bezier(.18,.88,.38,1) forwards}
@keyframes coinFountain{0%{opacity:1;transform:translate(0,0) scale(.5)}45%{opacity:1;transform:translate(calc(var(--dx)*.66),var(--dy)) scale(1.14) rotate(80deg)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 105px)) scale(.7) rotate(180deg)}}

/* Top App Header - Airy spacing */
.app-top{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:14px 20px 12px;flex:none;gap:12px;z-index:15}
.app-top b{font-size:24px;font-weight:800;display:block;line-height:1.22;letter-spacing:-.015em}
.comp-pill{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:4px 11px;border-radius:99px;background:var(--card-soft);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:var(--border);font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;box-shadow:0 3px 10px rgba(128,106,76,.04);transition:transform .14s var(--jelly)}
.comp-pill:active{transform:scale(.96)}
.ibtn{width:40px;height:40px;border-radius:14px;background:var(--card);backdrop-filter:blur(var(--blur));border:var(--border);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:transform .14s var(--jelly),background .15s}
.ibtn:active{transform:scale(.91);background:#f9f6f0}

/* Main Viewport & Subpage Segmented Bar */
.main-view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.swipe-pages,.swipe-pages .scroll-pane{touch-action:pan-y pinch-zoom}
.subpage-nav{flex:none;padding:2px 20px 14px}
.subpage-nav:empty{display:none}
.subpage-nav .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:16px;padding:4px;gap:5px;background:rgba(175,148,112,.11)}
.subpage-nav .seg button{min-height:42px;border-radius:12px;font-size:14px;padding:6px 8px;white-space:normal;transition:all .18s ease}
.subpage-nav button:not(.on){color:var(--ink2)}
.scroll-pane{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 18px 116px;scrollbar-width:none}
@media(min-width:390px){.scroll-pane{padding:6px 20px 118px}}
.scroll-pane::-webkit-scrollbar{display:none}

/* Cards & Common Pills */
.card{background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.list-card{padding:6px 18px}
.seg{display:inline-flex;background:var(--track);border-radius:99px;padding:3.5px;gap:3px}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;border:0;background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:all .16s ease}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 8px rgba(80,60,35,.07)}
.qbtn{font:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:99px;border:1px solid var(--div);background:rgba(255,255,255,.92);color:var(--ink2);white-space:nowrap;cursor:pointer;transition:transform .12s,background .15s}
.qbtn:active{transform:scale(.94)}
.qbtn.on{background:var(--cta);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 4px 12px -2px rgba(47,104,230,.28)}
.prog{height:8px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.prog>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--prog);transition:width .32s var(--spring)}

/* Home Hero Stage - Cozy constellation hugging Pupu */
.hero{position:relative;display:grid;justify-items:center;gap:6px}
.hero-stage{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;grid-template-rows:repeat(2,1fr);align-items:center;justify-items:center;gap:6px;width:100%;max-width:420px;min-height:161px;padding-inline:clamp(3px,2vw,10px);background:radial-gradient(ellipse at center,rgba(255,255,255,.86),rgba(253,232,224,.42) 37%,transparent 70%)}
.say{position:relative;width:max-content;max-width:100%;background:var(--card);border:var(--border);border-radius:99px;padding:6px 13px;font-size:13px;line-height:1.4;font-weight:650;color:var(--ink2);text-align:center;z-index:3;box-shadow:0 6px 20px -4px rgba(128,106,76,.10);overflow-wrap:anywhere}
.say::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--card);border-right:var(--border);border-bottom:var(--border);transform:translateX(-50%) rotate(45deg)}
.pig-box{grid-area:1 / 2 / span 2;display:grid;place-items:center;width:min(100%,156px);border:0;background:none;cursor:pointer;filter:drop-shadow(0 10px 15px rgba(218,116,106,.15))}
.pig-box svg{display:block;width:100%;height:auto}
.pupu-float{animation:pFloat 2.4s ease-in-out infinite alternate;transform-origin:center bottom}
@keyframes pFloat{from{transform:translateY(-3.5px)}to{transform:translateY(3.5px)}}
.orb{position:relative;width:44px;height:44px;margin-bottom:11px;border-radius:50%;display:grid;place-items:center;border:2.5px solid rgba(255,255,255,.95);box-shadow:0 8px 18px -5px rgba(120,95,60,.13);cursor:pointer;font:inherit;transition:transform .16s var(--jelly)}
.orb-left{grid-column:1}.orb-right{grid-column:3}.orb-upper{grid-row:1}.orb-lower{grid-row:2}
.orb:hover{transform:scale(1.07)}
.orb:active{transform:scale(.95)}
.orb small{position:absolute;bottom:-12px;max-width:72px;font-size:10.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.95);padding:1.5px 6px;border-radius:99px;border:1px solid rgba(180,158,125,.15);box-shadow:0 3px 8px rgba(120,95,60,.07)}

/* Page Grids & Bento Layout */
.home-page,.flow-page,.insights-page{display:grid;gap:18px;min-width:0}
.home-page,.flow-page,.insights-page{grid-template-columns:minmax(0,1fr)}
.home-page,.calendar-page{gap:12px}
.home-page .sec-hd{margin:0 4px 7px;gap:8px}
.summary-link{flex:none;border:0;background:none;color:var(--ink2);font:inherit;font-size:12px;font-weight:650;padding:6px 0;cursor:pointer}
.bento2{display:grid;grid-template-columns:minmax(0,1.14fr) minmax(0,1fr);gap:12px}
.bento2>.card{min-width:0;padding:12px 13px;display:flex;flex-direction:column;justify-content:space-between;min-height:132px}
.home-budget{gap:7px}
.home-budget-head{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.home-budget-edit{min-height:28px;flex:none;padding:3px 9px;border:0;border-radius:99px;background:rgba(175,148,112,.11);color:var(--ink2);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:background .15s}
.home-quota{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:5px;min-width:0;min-height:36px;padding:6px 8px;border:0;border-radius:13px;background:#f7f4ec;color:var(--ink2);font:inherit;font-size:12px;text-align:left;cursor:pointer;transition:background .15s}
.home-quota b{color:var(--ink);font-size:13px;text-align:right;overflow-wrap:anywhere}
.home-quota svg{display:block;color:var(--muted)}
.home-quota:active,.home-budget-edit:active{background:#ece6d8}
.home-budget button:focus-visible{outline:2px solid var(--cta);outline-offset:2px}
.budget-balance{font-size:clamp(20px,6.2vw,27px);font-weight:800;line-height:1.12;letter-spacing:-.02em;overflow-wrap:anywhere}
.budget-balance.long{font-size:17.5px}
.home-budget-setup{min-height:38px;align-self:flex-start}
.home-trend-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.home-trend-bars{flex:1;display:flex;gap:4px;align-items:flex-end}
.home-trend-track{width:13px;height:53px;background:var(--track);border-radius:99px;display:flex;align-items:flex-end;overflow:hidden}
.home-page .action-card{padding:10px 13px;gap:11px}
.home-page .action-icon{width:38px;height:38px}
.summary-card{padding:9px 14px}
.summary-card .ent{padding:6px 0}
.summary-empty{display:flex;align-items:center;gap:9px;padding:3px 0}
.summary-empty .ledger-empty-art{width:43px;height:43px;border-radius:15px}
.summary-empty b{font-size:14px;line-height:1.4}
.summary-empty .qbtn{flex:none;margin-left:auto;min-height:36px;padding:6px 10px;background:#edf2ff;color:#2958ae;border:0}

/* Section Headers & Transaction Rows */
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 10px}
.sec-hd b{font-size:15.5px;font-weight:750}
.sec-hd span{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;padding:2px 0}
.ent{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--div);cursor:pointer;transition:opacity .15s}
.ent:last-child{border-bottom:0}
.ent:active{opacity:.72}
.ent .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
body[data-style="meditation"] .ent .ico{border-radius:50%}
.ent .m{flex:1;min-width:0}
.ent .m b{font-size:15px;font-weight:650;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .m span{font-size:12px;color:var(--muted);display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .m b span{color:inherit;font-size:inherit;margin:0}
.ent em{font-style:normal;font-weight:750;font-size:15.5px;white-space:nowrap;margin-left:4px}
.ent em.in{color:var(--green)}
.tag{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:99px;background:rgba(245,178,64,.16);color:#8f5e14;flex:none}
.tag.auto{background:rgba(40,164,100,.12);color:#207d4c}
.tag.merge{background:rgba(47,104,230,.11);color:#2958c8}

/* Search, Flow & Stamp Calendar */
.sbox{position:relative;display:flex;align-items:center}
.sbox input{width:100%;min-width:0;min-height:48px;padding:10px 36px 10px 38px;border-radius:16px;border:var(--border);background:#fff;box-shadow:var(--shadow);font:inherit;font-size:14px;color:var(--ink);outline:none;transition:box-shadow .18s}
.sbox input:focus-visible{outline:2px solid #a6bdf7;outline-offset:-2px}
.sbox input::-webkit-search-cancel-button{display:none}
.search-clear{position:absolute;right:6px;min-width:30px;height:34px;border:0;background:none;color:var(--muted);font:inherit;font-size:18px;cursor:pointer}
.flow-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.flow-results{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.flow-filter-button{min-height:48px;display:flex;align-items:center;gap:6px;border-radius:16px;padding:8px 13px;color:var(--ink2);background:var(--card);box-shadow:var(--shadow)}
.flow-filter-button.on{background:#eaf0ff;color:#2559cc;border-color:#d6e2ff}
.flow-filter-button i{font-style:normal;font-size:11px;background:var(--cta);color:#fff;padding:1px 6px;border-radius:99px}
.flow-summary{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;font-size:13px;font-weight:600;color:var(--ink2);padding:2px 4px}
.flow-summary .qbtn{margin-left:auto;color:#2958ae;padding:5px 11px}
.flow-selection{line-height:1.5;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.flow-filter-sheet{display:grid;gap:18px}
.flow-filter-sheet .backup-heading{margin:0}
.flow-filter-sheet fieldset{min-width:0;border:0}
.flow-filter-sheet legend{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.flow-filter-sheet .date-range{margin-top:10px}
.flow-filter-options{display:flex;flex-wrap:wrap;gap:8px}
.flow-filter-options .qbtn{min-height:38px;white-space:normal;max-width:100%;overflow-wrap:anywhere}
.calendar-card{padding:12px 14px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.calendar-head b{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#fdf4e3;color:#8f611c}
.calendar-month{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:750;color:var(--ink)}
.calendar-month .qbtn{min-width:36px;min-height:36px;display:grid;place-items:center;padding:0;background:#f7f4ec;border-color:transparent}
.frow{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;padding:3px 0}
.frow::-webkit-scrollbar{display:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-weekdays{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:5px}
.cal-c{display:grid;grid-template-rows:19px auto;justify-items:center;align-items:center;gap:1px;min-height:43px;padding:2px 1px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:all .16s ease}
.cal-c:not(.has-stamp) .dl{grid-row:1 / -1}
.cal-c svg{max-width:100%}
.cal-c:active{transform:scale(.95)}
.cal-c.sel{background:#fcfaf5;border-color:rgba(47,104,230,.22);box-shadow:0 4px 12px rgba(47,104,230,.08)}
.cal-c .dl{grid-row:2;font-size:12px;color:var(--ink2);font-weight:650;padding:1px 6px;border-radius:99px}
.cal-c.today .dl{background:var(--cta);color:#fff}
.calendar-detail-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:7px;margin-bottom:2px;border-bottom:1px solid var(--div)}
.calendar-detail-copy{flex:1 1 126px;min-width:0;overflow-wrap:anywhere}
.calendar-stamps{display:flex;gap:6px;margin-left:auto}
.calendar-detail-footer{display:flex;justify-content:flex-end}

/* Mine Page - Warm Apricot-Blush Pupu Card */
.mine-page{display:grid;gap:20px;padding-top:4px}
.mine-hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;background:linear-gradient(138deg,#fffdf9 0%,#fdf2ea 52%,#fbe5dc 100%);border:1px solid rgba(218,116,106,.18);color:var(--ink);box-shadow:0 12px 28px -8px rgba(190,118,95,.13),inset 0 1px 0 rgba(255,255,255,.92)}
.mine-hero::before{content:"";position:absolute;right:-28px;top:-28px;width:136px;height:136px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,172,.34) 0%,rgba(255,190,172,0) 70%);pointer-events:none}
.mine-hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mine-hero-brand{display:flex;align-items:center;gap:11px;min-width:0}
.mine-hero-badge{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#ffe9df,#ffd7c8);border:1px solid rgba(255,255,255,.85);color:#ce5a47;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(218,116,106,.14)}
.mine-hero-title{font-size:17px;font-weight:800;color:var(--ink);line-height:1.2}
.mine-hero .sw:not(.off){background:#e57063}
.mine-hero .sw.off{background:rgba(176,144,124,.25)!important}
.mine-status{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.76);border:1px solid rgba(190,152,128,.16);color:#7b604e;font-size:11.5px;font-weight:650;line-height:1.4}
.mine-status::before{content:"";width:6px;height:6px;flex:none;border-radius:50%;background:#c5a996}
.mine-status.active{color:#1f7a4c;background:rgba(225,246,234,.85);border-color:rgba(40,164,100,.2)}.mine-status.active::before{background:#28a464}
.mine-status.warning{color:#9a5b13;background:rgba(255,243,218,.9)}.mine-status.warning::before{background:#eb9c35}
.mine-hero-card{position:relative;margin-top:14px;padding:13px 15px;border-radius:18px;background:rgba(255,255,255,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.92);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 14px rgba(165,115,90,.05)}
.mine-count{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.mine-count-val{display:flex;align-items:baseline;gap:4px;color:var(--ink);font-size:13px;font-weight:700}
.mine-count strong{font-size:28px;line-height:1.05;font-weight:800;color:#392e24}
.mine-mascot-stamp{width:54px;height:54px;border-radius:18px;background:radial-gradient(circle at 35% 28%,#fff9ef,#fde6de 78%);border:1px solid rgba(218,116,106,.14);display:grid;place-items:center;flex:none}
.mine-manage{position:relative;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;min-height:44px;border-radius:14px;border:1px solid rgba(195,155,132,.16);background:rgba(255,255,255,.68);color:var(--ink2);text-align:left;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:background .15s,transform .12s}
.mine-manage span{display:inline-flex;align-items:center;gap:7px}
.mine-manage svg{flex:none;color:#c96554}
.mine-manage:active{background:rgba(255,255,255,.92);transform:scale(.99)}
.mine-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;margin-bottom:10px}
.mine-heading h2{font-size:15.5px;font-weight:750}
.mine-version{font-size:12px;color:var(--muted);font-weight:600}
.mine-auto-meta{margin:10px 4px 0;font-size:12px;color:var(--muted)}
.mine-group{padding:4px 16px;border-radius:22px}
.mine-row{display:flex;align-items:center;gap:13px;width:100%;min-height:64px;padding:12px 0;border:0;border-bottom:1px solid var(--div);background:transparent;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.mine-row:last-child{border-bottom:0}
.mine-row:active .action-copy{opacity:.72}
.mine-row .action-icon{width:40px;height:40px;border-radius:13px}
.mine-row .action-icon.sand{background:#faedd8;color:#9e6420}
.mine-row .action-icon.rose{background:#fde7e3;color:#c75545}
.mine-row .action-icon.plum{background:#eee7fc;color:#6850b8}
.mine-row .action-copy small{color:var(--muted);margin-top:1px}
.mine-row.permission-warning .action-copy small{color:#8b5414;font-weight:650}
.mine-row-arrow{display:flex;color:var(--muted);flex:none}
.mine-back{display:flex;align-items:center;gap:11px;min-height:44px}
.mine-back .ibtn{width:40px;height:40px}

.sw{width:44px;height:25px;border-radius:99px;background:var(--cta);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;right:3px;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:all .18s var(--jelly)}
.sw.off{background:rgba(150,145,140,.3)!important}.sw.off::after{right:auto;left:3px}
.sw.pending{background:#a16615!important}
button.sw{border:0;padding:0}
.channel-row{min-height:56px;cursor:default}
.channel-row .m b{white-space:normal;overflow:visible}
.channel-row .m .channel-warning{color:#8b5414;font-weight:650;white-space:normal}
.channel-tools{display:flex;align-items:center;gap:8px;flex:none}
.channel-tools .qbtn{color:#2659c2}

/* Floating Bottom Dock with soft fade backdrop */
.dock-wrap{position:absolute;left:0;right:0;bottom:0;padding:10px 18px 16px;pointer-events:none;z-index:30;background:linear-gradient(to top,rgba(245,240,229,.92) 20%,rgba(245,240,229,0) 100%)}
.summary-layout .dock-wrap{position:relative;flex:none;padding-top:6px}
.summary-layout .scroll-pane{padding-bottom:8px}
@media(max-height:720px){
  .summary-layout .app-top{padding-bottom:8px}
  .summary-layout .subpage-nav{padding-bottom:9px}
  .summary-layout .scroll-pane{padding-bottom:0}
  .home-page,.calendar-page{gap:9px}
  .hero-stage{min-height:129px}
  .pig-box{width:min(100%,128px)}
  .bento2>.card{padding:9px 10px;min-height:121px}
  .home-quota{gap:3px;padding-inline:6px}
  .home-page .action-copy small{display:none}
  .cal-grid{row-gap:2px}
  .cal-c{min-height:37px;grid-template-rows:17px auto}
  .cal-c svg{max-height:17px}
}
@media(max-width:355px){
  .calendar-month{gap:4px;font-size:13px}
  .calendar-month .qbtn{min-width:31px;min-height:33px}
  .calendar-head b{padding-inline:7px;font-size:11px}
}
.dock{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--dock);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.94);border-radius:28px;padding:6px 10px;box-shadow:0 14px 34px -6px rgba(55,45,32,.13)}
.ditem{flex:1;min-width:0;height:52px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--ink2);position:relative;white-space:nowrap;transition:background .18s,color .18s}
.ditem.on{background:var(--dock-on);color:var(--cta);font-weight:750}
.ditem.on svg [data-tone]{fill-opacity:.28}
.dadd{flex:none;width:50px;height:50px;margin:0 6px;border-radius:50%;border:0;background:var(--cta);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--cta-sh);transition:transform .16s var(--jelly)}
.dadd:active{transform:scale(.92)}
.ndot{position:absolute;top:6px;right:14px;width:6.5px;height:6.5px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}

/* Bottom Sheets & Keypad */
.mask{position:absolute;inset:0;background:rgba(32,28,24,.36);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:65;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:89%;background:var(--canvas);border-radius:30px 30px 0 0;padding:12px 20px 30px;position:relative;overflow-y:auto;box-shadow:0 -14px 38px rgba(30,24,18,.15)}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:rgba(130,115,95,.22);margin:0 auto 14px}
.sheet.add-sheet{padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:94%}
@media(min-width:390px){.sheet.add-sheet{padding-inline:18px}}
.cta-btn{font:inherit;width:100%;min-height:46px;border-radius:99px;border:0;background:var(--cta);color:#fff;font-size:14.5px;font-weight:700;box-shadow:var(--cta-sh);cursor:pointer;transition:transform .14s,opacity .15s}
.cta-btn:active{transform:scale(.98)}
.cta-btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--div);box-shadow:none}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kk{height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:17px;font-weight:700;cursor:pointer;border:1px solid rgba(180,158,125,.08);box-shadow:0 2px 6px rgba(90,70,45,.04);transition:transform .1s,background .12s}
.kk:active{transform:scale(.95);background:#f6f3ec}
.kk.ok{background:var(--cta);color:#fff;font-size:13.5px;border:0;box-shadow:var(--cta-sh)}
.add-sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}
.manual-date-time{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.manual-dir-seg{background:rgba(175,148,112,.13);padding:3px;border-radius:99px;flex:none}
.manual-dir-seg button{padding:5.5px 13px;font-size:13px;font-weight:700;border-radius:99px}
.manual-dir-seg button.on.is-out{color:var(--ink);background:#fff;box-shadow:0 2px 7px rgba(80,60,35,.08)}
.manual-dir-seg button.on.is-in{color:#1c7c4c;background:#e6f7ee;box-shadow:0 2px 7px rgba(40,164,100,.12)}
.datetime-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;min-height:36px;border-radius:99px;background:rgba(255,255,255,.92);border:1px solid rgba(47,104,230,.15);color:var(--ink);font-size:12.5px;font-weight:750;cursor:pointer;box-shadow:0 2px 8px rgba(128,106,76,.05);transition:transform .12s,background .15s,border-color .15s;margin-left:auto;max-width:100%}
.datetime-chip svg{flex:none;color:var(--cta)}
.datetime-chip:active{background:#eff4ff;border-color:rgba(47,104,230,.3);transform:scale(.97)}
.datetime-chip .dt-date-part{white-space:nowrap}
.datetime-chip .dt-sep{width:1px;height:12px;background:rgba(160,140,115,.28);flex:none}
.datetime-chip .dt-time-part{white-space:nowrap;letter-spacing:.01em}
.datetime-chip .time-sec{font-size:11px;color:var(--muted);font-weight:700;margin-left:.5px}
.datetime-chip .dt-arrow{color:var(--muted);font-size:14px;font-weight:700;line-height:1;margin-left:1px}

/* Unified Hero Receipt Ticket */
.manual-ticket{background:#fff;border:var(--border);border-radius:22px;padding:12px 14px 9px;box-shadow:0 8px 22px -8px rgba(128,106,76,.09);transition:border-color .2s,background .2s}
.manual-ticket.is-income{border-color:rgba(40,164,100,.22);background:linear-gradient(180deg,#ffffff 0%,#f9fefb 100%)}
.manual-amount{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px dashed rgba(175,148,112,.22)}
.manual-cat-badge{display:inline-flex;align-items:center;gap:9px;min-width:0;flex:1}
.manual-cat-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);transition:background .18s,color .18s}
.manual-cat-meta{display:flex;flex-direction:column;min-width:0}
.manual-cat-meta small{font-size:11px;font-weight:650;color:var(--muted);line-height:1.2}
.manual-cat-meta b{font-size:15px;font-weight:750;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.manual-amount-val{display:flex;align-items:baseline;gap:2px;margin-left:auto;text-align:right;font-size:31px;font-weight:800;line-height:1.1;letter-spacing:-.015em;color:var(--ink);overflow-wrap:anywhere}
.manual-amount-val.long{font-size:24px}
.manual-amount-val.placeholder{color:#c0b5a7}
.manual-amount-val.income:not(.placeholder){color:var(--green)}
.manual-amount-val i{font-style:normal;font-size:.62em;font-weight:800;margin-right:1.5px;opacity:.88}
.manual-note-row{display:flex;align-items:center;gap:8px;padding-top:7px;color:var(--muted)}
.manual-note-row svg{flex:none;color:#a89682}
.manual-note-row input{flex:1;min-width:0;border:0;background:transparent;padding:3px 0;font:inherit;font-size:13.5px;color:var(--ink);outline:none}
.manual-note-row input::placeholder{color:#b0a190}
.manual-note-clear{border:0;background:rgba(175,148,112,.15);color:var(--ink2);width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;display:grid;place-items:center;cursor:pointer;flex:none}
.manual-note-clear[hidden]{display:none}

/* Symmetrical 5x2 Visual Category Grid */
.manual-categories{margin-top:10px}
.manual-cat-grid{--cat-row:70px;--cat-gap:6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:var(--cat-row);gap:var(--cat-gap);max-height:calc(var(--cat-row) * 2 + var(--cat-gap) + 4px);overflow-y:auto;padding:2px 1px;scrollbar-width:none}
.manual-cat-grid::-webkit-scrollbar{display:none}
@media(max-width:348px){.manual-cat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mcat-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px 5px;border-radius:15px;border:1.5px solid transparent;background:rgba(255,255,255,.66);color:var(--ink2);font:inherit;cursor:pointer;transition:transform .14s var(--jelly),background .15s,border-color .15s,box-shadow .15s}
.mcat-item:active{transform:scale(.93)}
.mcat-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;transition:transform .16s var(--jelly)}
.mcat-name{max-width:100%;font-size:11.5px;font-weight:650;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:2px}
.mcat-item.on{background:#fff;border-color:var(--cat-ring,rgba(47,104,230,.40));color:var(--ink);box-shadow:0 5px 14px -4px rgba(110,90,65,.13)}
.mcat-item.on .mcat-name{font-weight:800}
.mcat-item.on .mcat-ico{transform:scale(1.06)}
.mcat-item.manage{background:rgba(237,242,255,.72);border:1px dashed rgba(47,104,230,.28);color:#2958ae}
.mcat-item.manage .mcat-ico{background:#e3ecff;color:#2958ae}
.mcat-item.manage .mcat-name{color:#2958ae;font-weight:700}

/* Paste SMS Card */
.paste-card{background:#fff;border:var(--border);border-radius:20px;padding:13px 14px;box-shadow:0 4px 16px -6px rgba(128,106,76,.06)}
.paste-card textarea{width:100%;border:0;background:transparent;font:inherit;font-size:14px;line-height:1.55;color:var(--ink);outline:none;resize:none}
.paste-card textarea::placeholder{color:#afa08f}
.paste-hint{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--div);font-size:11.5px;color:var(--muted)}

/* Category Manager Overlay */
.manual-category-form{display:grid;gap:7px;margin:0 0 12px;padding:12px 13px;background:#fff;border:var(--border);border-radius:18px}
.manual-category-form label{font-size:13px;font-weight:700}
.manual-category-input{display:flex;gap:8px}
.manual-category-input input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--div);border-radius:12px;background:var(--canvas);font:inherit;font-size:15px;outline:none}
.manual-category-error,.calc-feedback{font-size:13px;color:#a83c34}
.manual-category-error:empty{display:none}
.entry-tool-layer{z-index:68}
.manual-category-list{background:var(--card);border:var(--border);border-radius:18px;padding:2px 12px}
.manual-category-row{display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--div)}
.manual-category-row:last-child{border-bottom:0}
.manual-category-row .mcat-row-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.manual-category-row b{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.manual-category-row button{display:grid;place-items:center;flex:none;width:33px;height:33px;border:0;border-radius:10px;background:#f5f2eb;color:var(--ink2);cursor:pointer}
.manual-category-row button:disabled{opacity:.36;cursor:default}
.manual-category-row .category-remove{width:auto;padding:0 9px;background:#fff2ef;color:#b44036;font:inherit;font-size:12px;font-weight:650}
.category-delete-confirm{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:6px 0 10px;padding:10px 12px;border-radius:13px;background:#fff3ec;font-size:12.5px}

/* Plump Manual Keypad & Calculator (Fig.2 Layout) */
.manual-keypad{gap:7px;margin-top:10px}
.manual-keypad .kk{height:48px;color:var(--ink);font-size:20px;font-weight:800;user-select:none}
.manual-keypad .kk.fn{background:#f4efe4;color:var(--ink2);border-color:rgba(175,148,112,.15)}
.manual-keypad .kk.operation{background:#eaf0ff;color:#2656be;border-color:rgba(47,104,230,.14);display:flex;flex-direction:column;justify-content:center;gap:1px;font-size:10.5px;font-weight:750}
.manual-keypad .kk.clear{font-size:13.5px;font-weight:750;background:#f4efe4;color:var(--ink2);border-color:rgba(175,148,112,.15)}
.manual-keypad .kk.ok{grid-column:4;grid-row:3 / span 2;height:100%;min-height:103px;border-radius:17px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:800;letter-spacing:.02em;transition:transform .12s,background .18s,opacity .18s}
.manual-keypad .kk.ok.income{background:var(--green);box-shadow:0 10px 22px -5px rgba(40,164,100,.36)}
.manual-keypad .kk.ok.is-empty{opacity:.78}

.calc-readout{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:4px;min-height:80px;padding:14px 18px;border:var(--border);border-radius:20px;background:#fff;text-align:right;box-shadow:0 4px 14px -4px rgba(128,106,76,.06);overflow-wrap:anywhere}
.calc-expression{width:100%;font-size:31px;font-weight:800;line-height:1.18;letter-spacing:-.015em;color:var(--ink);transition:font-size .14s,color .14s}
.calc-expression.is-zero{color:#bfb3a4}
.calc-expression.mid{font-size:24px}
.calc-expression.long{font-size:19.5px}
.calc-expression.settled{font-size:15px;font-weight:700;color:var(--muted)}
.calc-expression .calc-op{color:var(--cta);font-weight:800;padding:0 3px}
.calc-feedback{width:100%;font-size:15.5px;font-weight:750;line-height:1.25;color:#a83c34}
.calc-feedback:empty{display:none}
.calc-feedback.preview{color:#2958ae;font-size:16px;font-weight:800}
.calc-feedback.result{color:var(--cta);font-size:31px;font-weight:800;letter-spacing:-.015em}

.calc-keys{gap:8px;margin-top:12px}
.calc-keys .kk{height:48px;color:var(--ink);font-size:20.5px;font-weight:800;user-select:none}
.calc-keys .kk.operation{background:#eaf0ff;color:#2454b8;border-color:rgba(47,104,230,.13);font-size:22px;font-weight:800}
.calc-keys .kk.clear{font-size:14px;font-weight:750;background:#f4efe4;color:var(--ink2);border-color:rgba(175,148,112,.15)}
.calc-keys .kk.dot{font-size:23px;font-weight:800}
.calc-keys .kk.ok{grid-column:4;grid-row:4 / span 2;height:100%;min-height:104px;border-radius:17px;background:var(--cta);color:#fff;font-size:14.5px;font-weight:800;letter-spacing:.02em;padding:0 8px;text-align:center;line-height:1.3;box-shadow:var(--cta-sh)}

@media(max-height:700px){
  .manual-ticket{padding:9px 12px 7px}
  .manual-amount-val{font-size:26px}
  .manual-cat-grid{--cat-row:60px;--cat-gap:5px}
  .mcat-item{padding:4px 2px}
  .mcat-ico{width:30px;height:30px}
  .manual-keypad,.calc-keys{gap:6px;margin-top:8px}
  .manual-keypad .kk,.calc-keys .kk{height:43px}
  .manual-keypad .kk.ok,.calc-keys .kk.ok{min-height:92px}
  .calc-readout{min-height:68px;padding:10px 15px}
  .calc-expression,.calc-feedback.result{font-size:26px}
}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(36,32,28,.92);backdrop-filter:blur(8px);color:#fff;font-size:12.5px;font-weight:600;padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .2s var(--jelly);z-index:200;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
.empty{color:var(--muted);text-align:center;padding:18px 14px;font-size:13px}
.edit-field{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--div);font-size:13.5px;color:var(--muted)}
.edit-field input{min-width:0;width:62%;text-align:right;padding:4px 2px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:650;outline:none}

/* Shared Controls, Action Cards & Date Picker */
.action-card{width:100%;display:flex;align-items:center;text-align:left;gap:14px;padding:15px 17px;border:var(--border);border-radius:22px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);font:inherit;cursor:pointer;transition:transform .14s,background .15s}
.action-card:active,.date-chip:active,.date-nav:active{background:#f4f7ff;transform:scale(.99)}
.action-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#edf2ff;color:var(--cta);flex:none}
.action-icon.mint{background:#e3f4ea;color:#287a53}
.action-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
.action-copy b{font-size:15px;font-weight:700}
.action-copy small{color:var(--muted);font-size:12.5px;line-height:1.45}
.action-arrow{font-size:20px;line-height:1;color:var(--muted)}
.date-chip{min-width:0;display:flex;align-items:center;gap:7px;border:1px solid rgba(47,104,230,.12);border-radius:14px;background:#eff4ff;color:#294b8a;font:inherit;font-size:13px;font-weight:650;padding:8px 11px;min-height:42px;cursor:pointer;text-align:left}
.date-chip svg{flex:none;color:var(--cta)}
.date-chip-label{min-width:0;flex:1;white-space:nowrap}
.date-chip small{display:block;color:#5f6e8b;font-size:11.5px;font-weight:550;margin-bottom:1px}
.date-range{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:2px 0}
.date-range .date-chip{min-height:48px}
.date-layer{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:14px;background:rgba(36,32,48,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.date-panel{width:min(100%,362px);max-height:100%;overflow-y:auto;background:var(--card);border-radius:28px;padding:16px;box-shadow:0 18px 48px rgba(36,33,64,.22);scrollbar-width:none}
.date-panel::-webkit-scrollbar{display:none}
.date-panel-head,.date-month,.date-shortcuts,.date-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date-panel-head{margin-bottom:10px}
.date-panel-head h3{font-size:17px;font-weight:800}
.date-panel-head p{font-size:12.5px;font-weight:700;color:var(--cta);margin-top:2px}
.date-shortcuts .qbtn{padding:5px 11px;font-size:12px}
.date-month{padding:4px 0 6px}
.date-nav{border:0;border-radius:12px;min-width:34px;min-height:34px;background:#f2f5fb;color:var(--cta);font:inherit;font-size:19px;font-weight:700;cursor:pointer}
.date-nav:disabled{opacity:.38;cursor:default}
.date-month select{color:var(--ink);border:1px solid var(--div);border-radius:10px;padding:5px 8px;background:var(--card);font:inherit;font-size:12.5px;font-weight:700}
.date-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-top:2px}
.date-weekday{color:var(--muted);font-size:11px;font-weight:650;padding:4px 0}
.date-day{border:1px solid transparent;border-radius:11px;min-height:34px;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.date-day.today{border-color:#cedbff;color:var(--cta);font-weight:800}
.date-day.chosen{background:var(--cta);color:#fff;font-weight:800;box-shadow:0 3px 10px -2px rgba(47,104,230,.35)}
.date-day:disabled{color:#c0bab0;font-weight:500;cursor:default}
.dt-time-section{margin-top:12px;padding-top:12px;border-top:1px dashed var(--div);display:grid;gap:9px}
.dt-time-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.dt-time-title{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:750;color:var(--ink)}
.dt-time-title svg{color:var(--cta)}
.dt-presets{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dt-preset-chip{border:0;border-radius:99px;background:#f4f1ea;color:var(--ink2);font:inherit;font-size:11px;font-weight:700;padding:4px 8px;cursor:pointer;transition:background .14s,color .14s}
.dt-preset-chip:active{background:#e7efff;color:var(--cta)}
.dt-time-boxes{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px}
.dt-colon{font-size:18px;font-weight:800;color:var(--muted);padding-bottom:16px}
.dt-time-col{display:grid;gap:3px;text-align:center}
.dt-time-col small{font-size:11px;font-weight:650;color:var(--muted)}
.dt-stepper{display:flex;align-items:center;background:#f7f4ec;border:1px solid rgba(180,158,125,.16);border-radius:13px;padding:3px;gap:2px}
.dt-step{width:26px;height:32px;border:0;border-radius:9px;background:#fff;color:var(--ink2);font:inherit;font-size:15px;font-weight:800;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 1px 3px rgba(90,70,45,.06)}
.dt-step:active{background:#edf2ff;color:var(--cta)}
.dt-time-input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font-size:17.5px;font-weight:800;text-align:center;padding:4px 0;outline:none;border-radius:7px}
.dt-time-input:focus{background:#fff;color:var(--cta)}
@media(max-width:345px){.dt-colon{display:none}.dt-time-boxes{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.dt-step{width:22px}}
.date-footer{margin-top:14px;gap:10px}
.date-footer .cta-btn{flex:1}

/* Insights - Trend & Dual Donut */
.trend-head,.donut-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.donut-head b{font-size:16.5px;font-weight:750}
.donut-body{display:grid;grid-template-columns:148px minmax(0,1fr);align-items:center;gap:18px;margin-top:16px}
@media(max-width:355px){.donut-body{grid-template-columns:minmax(0,1fr)}}
.donut-figure{position:relative;width:100%;max-width:148px;justify-self:center;aspect-ratio:1}
.donut-figure>svg{display:block;width:100%;height:100%}
.donut-label{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:650;overflow-wrap:anywhere}
.trend-series,.trend-filters,.trend-periods{display:flex;flex-wrap:wrap;gap:7px}
.trend-series button,.trend-filters button,.trend-periods button,.trend-period-button{font:inherit;font-size:13px;font-weight:650;padding:7px 11px;min-height:36px;border:1px solid var(--div);border-radius:13px;background:#fff;color:var(--ink2);cursor:pointer;transition:all .15s}
.trend-series button{display:flex;align-items:center;gap:6px;white-space:nowrap}
.trend-series button[aria-pressed=true]{border-color:var(--series);color:var(--series);background:#fcfdff;font-weight:700}
.trend-series i{width:7px;height:7px;border-radius:50%;background:var(--series);display:inline-block}
.trend-series button[aria-pressed=false] i{background:#bfb9b1}
.trend-period-button{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;background:#eff4ff;border-color:rgba(47,104,230,.12);color:#294b8a;font-weight:700}
.trend-period-button svg{flex:none;opacity:.85}
.trend-period-title{font-size:16.5px;margin-bottom:12px}
.trend-periods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.trend-periods button{font-size:13px;min-height:40px}
.trend-periods button.on{background:#eaf0ff;color:#2559cc;border-color:#d6e2ff;font-weight:700}
.trend-range-apply{margin-top:12px}
.trend-filters{margin-top:12px;gap:10px}
.trend-filters button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:#f7f4ec;border-color:transparent}
.trend-filters button.on{color:#2559cc;background:#eaf0ff;border-color:#d6e2ff}
.trend-detail{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;margin-top:14px;padding:12px 14px;border-radius:16px;background:#f8f5ee;font-size:13px}
.trend-period-readout,.trend-values{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.trend-period-readout small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.trend-values span{white-space:nowrap}
.category-options{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.category-options .qbtn{min-height:36px}

/* Backup, Updates, Empty States & Budget */
.backup-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.backup-heading h3{font-size:17.5px;font-weight:800}
.backup-heading .ibtn{font:inherit;font-size:20px;width:36px;height:36px;border-radius:12px}
.backup-actions,.dav-form{display:grid;gap:10px;margin-top:14px}
.backup-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dav-form label{display:grid;gap:5px;font-size:12.5px;font-weight:650}
.dav-form input{width:100%;padding:10px 12px;border:1px solid var(--div);border-radius:13px;background:white;color:var(--ink);font:inherit}
.dav-password{position:relative;display:block;min-width:0}
.dav-password input{color:transparent;-webkit-text-fill-color:transparent;caret-color:#252525;text-shadow:none}
.dav-password input::selection{color:transparent;-webkit-text-fill-color:transparent}
.dav-password-mask{position:absolute;inset:1px 12px;display:flex;align-items:center;overflow:hidden;white-space:pre;color:#202020;pointer-events:none}
.dav-password-mask span{flex:none}
.dav-help,.dav-status,.dav-confirm p{font-size:11.5px;line-height:1.55}
.dav-help{color:var(--muted)}
.dav-status{color:var(--cta)}
.dav-status:empty{display:none}
.dav-status.error{color:#a83c34}
.dav-confirm{background:#fffcf5;border:1px solid var(--div);border-radius:16px;padding:12px}
.dav-confirm p{margin-bottom:10px}
.cta-btn:disabled{opacity:.45;cursor:default}
.updates-body{display:grid;gap:11px;margin-top:14px}
.update-summary{display:grid;gap:5px;padding:14px 16px;border-radius:18px;background:var(--track)}
.update-summary b{font-size:14.5px}.update-summary p,.update-caption,.release-date{font-size:11.5px;color:var(--muted);line-height:1.5}
.update-caption.error{color:#a83c34}
.release-entry{background:var(--card);border:var(--border);border-radius:18px;padding:12px 14px}
.release-entry summary{cursor:pointer;font-size:13.5px;font-weight:700;overflow-wrap:anywhere}
.release-date{display:block;font-weight:500;margin:4px 0 0 15px}
.release-notes{display:grid;gap:7px;margin:10px 0 6px;color:var(--ink2);font-size:12.5px;line-height:1.65;overflow-wrap:anywhere}
.release-notes h4{color:var(--ink);font-size:14px;font-weight:750;margin-top:4px}
.release-notes ul,.release-notes ol{padding-inline-start:1.4em}
.release-notes li+li{margin-top:3px}
.release-notes code{padding:1px 4px;border-radius:4px;background:var(--track);font-size:.96em}
.update-links{display:flex;gap:8px 14px;flex-wrap:wrap;margin-top:12px}
.update-links button{min-height:36px;padding:0 4px;background:none;border:0;color:var(--cta);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.ledger-empty{display:flex;align-items:center;gap:16px;padding:18px 10px;min-height:112px}
.ledger-empty-art{flex:none;width:64px;height:64px;display:grid;place-items:center;border-radius:22px;background:radial-gradient(circle at 35% 25%,#fff6e4,#fde8e0 75%)}
.ledger-empty-copy{min-width:0;display:grid;justify-items:start;gap:5px}
.ledger-empty-copy b{font-size:15px}.ledger-empty-copy p{font-size:13px;color:var(--muted);line-height:1.5}
.ledger-empty-copy button{margin-top:4px;min-height:36px;background:#edf2ff;color:#2958ae;border:0;padding:6px 14px}
.budget-periods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}
.budget-periods button{min-height:36px;padding-inline:4px}
.budget-card{display:grid;gap:10px;padding:15px 16px;background:var(--card);border:var(--border);border-radius:18px;margin-bottom:14px}
.budget-card small{font-size:12.5px;color:var(--muted);line-height:1.55}
.budget-card input{width:100%;padding:9px 12px;color:var(--ink);background:var(--canvas);border:var(--border);border-radius:12px;font:inherit;font-size:17px;font-weight:700;outline:none}
.channel-recovery{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;margin:0 0 10px;border-radius:15px;background:#fff3dc;color:#7c5419;font-size:12px;line-height:1.45}
.worth-empty{display:grid;justify-items:center;gap:12px;text-align:center;padding:28px 20px 30px}
.worth-empty-art{display:grid;place-items:center;width:128px;height:128px;background:radial-gradient(circle at 36% 26%,#fff6e4,#fde8e0 74%);border-radius:44px}
.worth-empty h3{font-size:18px}.worth-empty p{font-size:13.5px;color:var(--muted);line-height:1.6;max-width:270px}
.worth-empty .cta-btn{margin-top:6px;max-width:210px}
.quota-details{display:grid;gap:10px;margin:12px 0 16px}
.quota-rows{padding:4px 15px;border-radius:16px;background:var(--card);border:var(--border)}
.quota-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;padding:11px 0;font-size:14px}
.quota-row+.quota-row{border-top:1px solid var(--div)}.quota-row dt{color:var(--muted)}.quota-row dd{margin-left:auto;font-weight:700;text-align:right;overflow-wrap:anywhere}
.quota-note{font-size:13px;color:var(--muted);line-height:1.55}
@media(min-width:620px){
  body{background:#ebe4d7}
  .shell{width:min(100%,490px);margin-inline:auto;box-shadow:0 0 56px rgba(90,74,54,.14)}
}
.pending-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;background:linear-gradient(135deg,#fffdf9,#fff7ed);border-color:rgba(245,166,35,.22);cursor:pointer}
.pending-card>div{min-width:0;overflow-wrap:anywhere}
</style>

function save(){
  const old = new Map(baseline.txns.map(t=>[t.id,t]));
  const ids = new Set(S.txns.map(t=>t.id));
  const changed = S.txns.filter(t=>JSON.stringify(t)!==JSON.stringify(old.get(t.id)));
  const deleted = baseline.txns.filter(t=>!ids.has(t.id)).map(t=>t.id);
  const settings={};
  for(const key of ['firstMetDate','budgetLimits','autoGuard','channels','stamps','rules']){
    if(JSON.stringify(S[key])!==JSON.stringify(baseline[key])) settings[key]=S[key];
  }
  if(!changed.length&&!deleted.length&&!Object.keys(settings).length)return true;
  const error=Ledger.apply(JSON.stringify({changed,deleted,settings}));
  syncLedger();
  if(error){toast(error);return false;}
  return true;
}

function getCompanionStats(){
  const t0 = new Date((S.firstMetDate||TODAY)+'T00:00:00'), t1 = new Date(TODAY+'T00:00:00');
  const metDays = Math.max(1, Math.floor((t1 - t0)/86400000) + 1);
  const usedDays = new Set(S.txns.filter(t=>t.status!=='已忽略').map(t=>t.date)).size;
  return { metDays, usedDays };
}

function dayStat(dateStr){
  let out=0, inc=0;
  S.txns.forEach(t=>{
    if(t.date===dateStr && t.status!=='已忽略'){
      if(t.dir==='支出') out+=t.cents;
      else if(t.dir==='退款') out-=t.cents;
      else if(t.dir==='收入') inc+=t.cents;
    }
  });
  return { out:Math.max(0,out), inc, net:inc-Math.max(0,out) };
}
function getQuota(){return S.quota;}
function hasBudget(){return Object.values(S.budgetLimits).some(amount=>amount>0);}
function hasRecordedDay(date){
  return date<=TODAY && S.txns.some(t=>t.date===date && t.status==='已入账');
}
function dayStamp(date,size){
  return hasRecordedDay(date)?stp(getMood(date),size):'';
}
function getMood(date){
  if(S.stamps[date])return S.stamps[date];
  const out=dayStat(date).out, quota=S.quotas[date];
  if(date===TODAY&&!hasBudget()&&out>0)return 'ok';
  const q=quota == null ? getQuota() : quota;
  return out<=q*.8?'happy':out<=q?'ok':'sad';
}

function switchSubpage(tab,index){
  if(S.tab!==tab)return;
  const [key,...pages]=SWIPE_PAGES[tab];
  const direction=index-pages.indexOf(S[key]);
  if(!direction||index<0||index>=pages.length)return;
  S[key]=pages[index];
  slideView(direction);
}
function bindSubpageSwipe(){
  const surface=document.getElementById('main-view');
  let gesture=null, suppressClick=false;
  const blocked=()=>['sheet-root','date-root'].some(id=>document.getElementById(id).childElementCount);
  surface.addEventListener('pointerdown',event=>{
    gesture=null;
    if(!event.isPrimary)return;
    suppressClick=false;
    if(event.pointerType!=='touch'||!SWIPE_PAGES[S.tab]||blocked())return;
    if(event.target.closest('input,textarea,select,[contenteditable]'))return;
    const [key,...pages]=SWIPE_PAGES[S.tab];
    gesture={id:event.pointerId,tab:S.tab,index:pages.indexOf(S[key]),x:event.clientX,y:event.clientY,horizontal:false};
  });
  surface.addEventListener('pointermove',event=>{
    if(gesture?.id!==event.pointerId||gesture.horizontal)return;
    const dx=Math.abs(event.clientX-gesture.x),dy=Math.abs(event.clientY-gesture.y);
    if(dy>=10&&dy>dx){gesture=null;return;}
    if(dx<9||dx<dy*1.2)return;
    gesture.horizontal=true;
    suppressClick=true;
    surface.setPointerCapture(event.pointerId);
  });
  surface.addEventListener('pointerup',event=>{
    if(gesture?.id!==event.pointerId)return;
    const {x,y,tab,index}=gesture;
    gesture=null;
    if(S.tab!==tab||blocked())return;
    const dx=event.clientX-x,dy=event.clientY-y;
    const threshold=Math.max(32,Math.min(52,surface.clientWidth*.11));
    if(Math.abs(dx)<threshold||Math.abs(dx)<Math.abs(dy)*1.25)return;
    const [key,...pages]=SWIPE_PAGES[tab];
    if(pages.indexOf(S[key])!==index)return;
    suppressClick=true;
    switchSubpage(tab,index+(dx<0?1:-1));
  });
  surface.addEventListener('pointercancel',()=>{gesture=null;});
  surface.addEventListener('click',event=>{
    if(!suppressClick||event.detail===0)return;
    suppressClick=false;
    event.preventDefault();
    event.stopImmediatePropagation();
  },true);
}

/* ==================== 2. 日历 & 多维搜索/日期/种类筛选 ==================== */
function jumpFilterCat(cat){
  S.postedOnly=false;
  S.calSub='list'; S.datePreset='all'; S.dirFilter='全部'; S.catFilter=cat; S.q='';
  goTab('cal');
}
function resetFilters(){ S.postedOnly=false; S.q=''; S.datePreset='all'; S.dirFilter='全部'; S.catFilter='全部种类'; }
function openDayFlow(date){
  resetFilters();
  if(date===TODAY)applyDatePreset('today');
  else{ S.datePreset='custom'; S.dateFrom=date; S.dateTo=date; }
  S.calSub='list';
  goTab('cal');
}
function applyDatePreset(p){
  S.datePreset = p;
  if(p==='today'){ S.dateFrom=TODAY; S.dateTo=TODAY; }
  else if(p==='3d'){ S.dateFrom=shiftDay(TODAY,-2); S.dateTo=TODAY; }
  else if(p==='7d'){ S.dateFrom=shiftDay(TODAY,-6); S.dateTo=TODAY; }
  else if(p==='month'){ S.dateFrom=MONTH+'-01'; S.dateTo=fmtDate(MONTH,daysIn(MONTH)); }
}
function getFilteredTxns(){
  const q = (S.q||'').trim().toLowerCase();
  return S.txns.filter(t=>{
    if(t.status==='已忽略'||(S.postedOnly&&t.status!=='已入账')) return false;
    if(S.datePreset!=='all'){
      if(S.dateFrom && t.date < S.dateFrom) return false;
      if(S.dateTo && t.date > S.dateTo) return false;
    }
    if(S.dirFilter==='支出' && t.dir!=='支出') return false;
    if(S.dirFilter==='收入' && t.dir!=='收入') return false;
    if(S.dirFilter==='自动记账' && !t.auto) return false;
    if(S.dirFilter==='待确认' && t.status!=='待确认') return false;
    if(S.catFilter!=='全部种类' && t.category!==S.catFilter) return false;
    if(q){
      const hay = `${t.merchant} ${t.category} ${t.note||''} ${t.source} ${fmt(t.cents)}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

        <button type="button" class="search-clear" aria-label="清除搜索" ${S.q?'':'hidden'} onclick="updateFlowSearch('');document.getElementById('q-inp').focus()">×</button>
      </div>
      ${flowFilterButton()}

    <div class="flow-results" id="flow-results">${renderFlowResults()}</div>
  </div>`;
}

const FLOW_DATE_PRESETS=[['all','全部日期'],['today','今天'],['3d','近3天'],['7d','近7天'],['month','本月'],['custom','自定义区间']];
function flowSelection(){
  return [S.datePreset==='custom'?`${dateLabel(S.dateFrom)} 至 ${dateLabel(S.dateTo)}`:S.datePreset==='all'?'':FLOW_DATE_PRESETS.find(([key])=>key===S.datePreset)?.[1],
    S.dirFilter==='全部'?'':S.dirFilter,S.catFilter==='全部种类'?'':S.catFilter,S.postedOnly?'仅已入账':''].filter(Boolean);
}
function flowFilterButton(){
  const count=flowSelection().length;
  return `<button class="qbtn flow-filter-button ${count?'on':''}" type="button" aria-haspopup="dialog" onclick="openFlowFilters()">${ico('filter',18)}筛选${count?` <i>${count}</i>`:''}</button>`;
}
function openFlowFilters(){
  const cats=['全部种类',...new Set([...S.categories,...S.txns.map(t=>t.category)])];
  const directions=['全部','支出','收入','自动记账','待确认'];
  const pill=(label,selected,action)=>`<button type="button" class="qbtn ${selected?'on':''}" aria-pressed="${selected}" onclick="${action}">${esc(label)}</button>`;
  document.getElementById('sheet-root').innerHTML=`<div class="mask" onclick="if(event.target===this)closeSheet()"><section class="sheet flow-filter-sheet" role="dialog" aria-modal="true" aria-label="账单筛选">
    <div class="backup-heading"><h3>账单筛选</h3><button class="ibtn" aria-label="关闭筛选" onclick="closeSheet()">×</button></div>
    <fieldset><legend>日期</legend><div class="flow-filter-options">${FLOW_DATE_PRESETS.map(([k,name])=>pill(name,S.datePreset===k,`applyDatePreset('${k}');refreshFlowFilters()`)).join('')}</div>
      ${S.datePreset==='custom'?rangeButtons(S.dateFrom,S.dateTo,'openFlowDate'):''}</fieldset>
    <fieldset><legend>方向与状态</legend><div class="flow-filter-options">${directions.map(dir=>pill(dir,S.dirFilter===dir,`S.postedOnly=false;S.dirFilter=${arg(dir)};refreshFlowFilters()`)).join('')}</div></fieldset>
    <fieldset><legend>分类</legend><div class="flow-filter-options">${cats.map(cat=>pill(cat,S.catFilter===cat,`S.catFilter=${arg(cat)};refreshFlowFilters()`)).join('')}</div></fieldset>
    <div class="backup-columns"><button class="cta-btn ghost" onclick="resetFilters();refreshFlowFilters()">重置</button><button class="cta-btn" onclick="closeSheet()">查看结果</button></div>
  </section></div>`;
}
function refreshFlowFilters(){
  const sheet=document.querySelector('.flow-filter-sheet');
  const scroll=sheet.scrollTop;
  render();
  openFlowFilters();
  document.querySelector('.flow-filter-sheet').scrollTop=scroll;
}
function updateFlowSearch(value){
  S.q=value;
  const field=document.getElementById('q-inp');
  if(field.value!==value)field.value=value;
  document.querySelector('.search-clear').hidden=!value;
  document.getElementById('flow-results').innerHTML=renderFlowResults();
}

function renderFlowResults(){
  const list = getFilteredTxns();
  let sumOut=0, sumIn=0;

  const filters=flowSelection();

  return `<div class="flow-summary">
      <span>共 <b>${list.length}</b> 笔 · 支 ¥${fmtS(sumOut)} · 收 ¥${fmtS(sumIn)} · 结余 <b style="color:${sumIn-sumOut>=0?'var(--green)':'var(--red)'}">¥${fmtS(sumIn-sumOut)}</b></span>

      ${filters.length?`<div class="flow-selection" style="flex-basis:100%">${filters.map(esc).join(' · ')}</div>`:''}
    </div>

    ${dates.map(dt=>{
      const rows = list.filter(t=>t.date===dt);
      return `<section><div style="display:flex;align-items:center;gap:8px;margin:2px 4px 9px;font-size:13.5px;font-weight:750;color:var(--ink2)">

      ?ledgerEmpty('没有匹配的账单','试试清除关键词和筛选条件。','重置筛选','resetFilters();render()')
      :ledgerEmpty('账本还是空的','记下第一笔收支，就能在这里查找。','记第一笔',"openAddSheet('manual',TODAY)")}</div>`:''}
  `;
}

/* ==================== 3 & 4. 洞察：支出/收入/结余交互趋势图 + 支出/收入双模圆环图 ==================== */

const MIN_DATE='1900-01-01';
const dateLabel=value=>value.replace(/-/g,'.');
function dateButton(value,action,label=''){
  return `<button type="button" class="date-chip" onclick="${action}" aria-label="${esc((label||'记账日期')+' '+value)}">
    ${ico('cal',15)}<span class="date-chip-label">${label?`<small>${label}</small>`:''}${value===TODAY&&!label?'今天 · '+value.slice(5).replace('-','/'):dateLabel(value)}</span><span aria-hidden="true">›</span>
  </button>`;
}
function rangeButtons(from,to,action){
  return `<div class="date-range">${dateButton(from,action+"('from')",'开始日期')}${dateButton(to,action+"('to')",'结束日期')}</div>`;
}
function openFlowDate(which){
  const from=which==='from';
  pickDate(from?S.dateFrom:S.dateTo, from?'开始日期':'结束日期', value=>{
    if(from){
      S.dateFrom=value;
      if(value>S.dateTo)S.dateTo=value;
    }else{
      S.dateTo=value;
      if(value<S.dateFrom)S.dateFrom=value;
    }
    refreshFlowFilters();
  });
}
let datePicker=null;
let datePickerReturnFocus=null;
function pickDate(value,title,onConfirm,max=TODAY){
  datePickerReturnFocus=document.activeElement;
  const selected=typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&value>=MIN_DATE&&value<=max?value:max;
  datePicker={selected,month:selected.slice(0,7),title,max,onConfirm,withTime:false};
  renderDatePicker();
  document.getElementById('date-heading').focus();
}
function pickDateTime(dateValue,timeValue,title,onConfirm,max=TODAY){
  datePickerReturnFocus=document.activeElement;
  const selected=typeof dateValue==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(dateValue)&&dateValue>=MIN_DATE&&dateValue<=max?dateValue:max;
  const normTime=/^(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$/.test(timeValue||'')?(timeValue.length===5?timeValue+':00':timeValue):clockTime();
  datePicker={selected,month:selected.slice(0,7),title,max,onConfirm,withTime:true,timeParts:normTime.split(':'),error:''};
  renderDatePicker();
  document.getElementById('date-heading').focus();
}
function closeDatePicker(){
  datePicker=null;
  document.getElementById('date-root').innerHTML='';
  if(datePickerReturnFocus&&datePickerReturnFocus.isConnected)datePickerReturnFocus.focus();
  datePickerReturnFocus=null;
}
function updatePickerLivePreview(){
  if(!datePicker)return;
  const el=document.getElementById('dt-live-preview');
  if(!el)return;
  el.textContent=datePicker.withTime
    ? `${dateLabel(datePicker.selected)} · ${datePicker.timeParts.map(v=>String(v||'0').padStart(2,'0')).join(':')}`
    : dateLabel(datePicker.selected);
}
function syncPickerTimeInput(index,val){
  if(!datePicker?.withTime)return;
  datePicker.timeParts[index]=val.replace(/[^\d]/g,'').slice(0,2);

const TREND_SERIES=[['out','支出','#dc6058'],['inc','收入','#288758'],['net','结余','#3168d7']];
const TREND_PERIODS=[['day','天'],['week','周'],['month','月'],['quarter','季'],['year','年'],['custom','自定义']];
const monthStart=(date,offset)=>dateKey(new Date(Number(date.slice(0,4)),Number(date.slice(5,7))-1+offset,1,12));
function trendBounds(){
  const period=S.trendPeriod;
  if(period==='custom')return [S.trendFrom,S.trendTo];
  if(period==='day')return [shiftDay(TODAY,-6),TODAY];
  if(period==='week'){
    const weekday=(new Date(TODAY+'T12:00:00').getDay()+6)%7;
    return [shiftDay(TODAY,-weekday-7*7),TODAY];
  }
  if(period==='month')return [monthStart(TODAY,-12),TODAY];
  if(period==='quarter'){
    const offset=(Number(TODAY.slice(5,7))-1)%3;
    return [monthStart(TODAY,-offset-3*7),TODAY];
  }
  const earliest=S.txns.reduce((first,t)=>t.status==='已入账'&&t.date>=MIN_DATE&&t.date<first?t.date:first,TODAY);
  const year=Math.min(Number(TODAY.slice(0,4))-3,Number(earliest.slice(0,4)));
  return [year+'-01-01',TODAY];
}

function trendData(from,to,period){
  const duration=Math.round((Date.parse(to)-Date.parse(from))/86400000)+1;
  const unit=period==='custom'?(duration<=31?'day':duration<=217?'week':duration<=1100?'month':'year'):period;
  const bins=[];
  for(let date=from;date<=to;){
    const month=Number(date.slice(5,7)), year=date.slice(0,4);
    let next=shiftDay(date,1);
    let label=date.slice(0,7)===to.slice(0,7)&&from.slice(0,7)===to.slice(0,7)?Number(date.slice(8))+'日':date.slice(5).replace('-','/');
    let periodName='';
    if(unit==='week'){
      const weekday=(new Date(date+'T12:00:00').getDay()+6)%7;
      next=shiftDay(date,7-weekday);
      label=date.slice(5).replace('-','/');
    }else if(unit==='month'){
      next=monthStart(date,1);
      label=(date===from||month===1?year+'·':'')+month+'月';
      periodName=year+'年'+month+'月';
    }else if(unit==='quarter'){
      const quarter=Math.floor((month-1)/3)+1;
      next=monthStart(date,3-(month-1)%3);
      label=(date===from||quarter===1?year+'·':'')+quarter+'季';
      periodName=year+'年第'+quarter+'季度';
    }else if(unit==='year'){
      next=String(Number(year)+1)+'-01-01';
      label=year;
      periodName=year+'年';
    }
    const end=next<=to?shiftDay(next,-1):to;
    const rangeLabel=dateLabel(date)+(end===date?'':' – '+dateLabel(end));
    bins.push({key:date,end,label,periodName,rangeLabel,out:0,inc:0,net:0});
    date=next;
  }
  const byId=new Map(S.txns.map(t=>[t.id,t]));
  const records=[];
  for(const txn of S.txns){
    if(txn.status!=='已入账'||txn.date<from||txn.date>to)continue;
    if(!['支出','收入','退款'].includes(txn.dir))continue;
    const side=txn.dir==='收入'?'收入':'支出';
    const category=txn.dir==='退款'?(byId.get(txn.refundOf)||txn).category:txn.category;
    const chosen=S.trendCategories[side];
    if(chosen.length&&!chosen.includes(category))continue;
    const bucket=bins.find(b=>txn.date>=b.key&&txn.date<=b.end);
    if(!bucket)continue;
    if(txn.dir==='收入')bucket.inc+=txn.cents;
    else bucket.out+=txn.dir==='退款'?-txn.cents:txn.cents;
    records.push(txn);
  }
  bins.forEach(b=>{b.net=b.inc-b.out;});
  return {bins,records};
}
function renderTrendChart(bins,selected,hasRecords){
  const width=320,plotHeight=132,left=13,right=13,top=9,bottom=20;
  const showYears=bins.some(bin=>bin.label.includes('·'));
  const height=plotHeight+(showYears?12:0);
  const visible=TREND_SERIES.filter(([key])=>S.trendSeries.includes(key));
  let min=0,max=0;
  for(const bin of bins)for(const [key] of visible){
    min=Math.min(min,bin[key]);max=Math.max(max,bin[key]);
  }
  if(min===max)max+=100;
  const step=(width-left-right)/Math.max(1,bins.length-1);
  const x=i=>bins.length===1?width/2:left+i*step;
  const y=value=>top+(max-value)/(max-min)*(plotHeight-top-bottom);
  const selectedIndex=bins.indexOf(selected);
  const fills=visible.map(([key,,color])=>{
    const points=bins.map((bin,i)=>x(i)+','+y(bin[key])).join(' ');
    return `<polygon points="${x(0)},${y(0)} ${points} ${x(bins.length-1)},${y(0)}" fill="${color}" opacity="${visible.length===1 ? .12 : .045}"/>`;
  }).join('');
  const lines=visible.map(([key,,color])=>{
    const points=bins.map((bin,i)=>x(i)+','+y(bin[key])).join(' ');
    const dots=bins.map((bin,i)=>{
      if(i===selectedIndex)return `<circle cx="${x(i)}" cy="${y(bin[key])}" r="4" fill="white" stroke="${color}" stroke-width="1.8"/>`;
      if(bins.length>31 && i%Math.ceil(bins.length/31)!==0)return '';
      return `<circle cx="${x(i)}" cy="${y(bin[key])}" r="2.55" fill="${color}"/>`;
    }).join('');
    return `<polyline data-series="${key}" points="${points}" fill="none" stroke="${color}" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  const every=Math.max(1,Math.ceil(bins.length/7));
  const placed=[[],[]];
  function axisText(value,row,i){
    if(!value)return '';
    const labelWidth=Array.from(value).reduce((total,char)=>total+(/[0-9.\\/]/.test(char)?6.8:11),0);
    const center=Math.min(width-2-labelWidth/2,Math.max(2+labelWidth/2,x(i)));
    const start=center-labelWidth/2,end=center+labelWidth/2;
    if(placed[row].some(([left,right])=>start<right+5&&end>left-5))return '';
    placed[row].push([start,end]);
    return `<text x="${center}" y="${plotHeight-7+row*12}" text-anchor="middle" font-size="${row===0?11:9.5}" fill="var(--ink2)">${esc(value)}</text>`;
  }
  const candidates=[0];
  if(bins.length>1)candidates.push(bins.length-1);
  for(let i=every;i<bins.length-1;i+=every)candidates.push(i);
  const labels=candidates.map(i=>{
    const parts=bins[i].label.split('·');
    const year=parts.length===2?parts[0]:'';
    return axisText(parts[parts.length-1],0,i)+axisText(year,1,i);
  }).join('');
  const targets=bins.map((b,i)=>{
    const start=i===0?0:x(i)-step/2;
    const end=i===bins.length-1?width:x(i)+step/2;
    return `<rect x="${start}" y="0" width="${end-start}" height="${height}" fill="transparent" onclick="S.trendSelected='${b.key}';render()"/>`;
  }).join('');
  const hint=!visible.length?'曲线已隐藏':!hasRecords?'该范围暂无账单':'';
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="收支趋势图" style="display:block;width:100%;height:auto;margin-top:14px;overflow:visible">
    <line x1="${left}" y1="${y(0)}" x2="${width-right}" y2="${y(0)}" stroke="var(--div)" stroke-dasharray="4 3"/>
    ${fills}${lines}${labels}
    ${hint?`<text x="${width/2}" y="${height/2}" text-anchor="middle" font-size="12" fill="var(--ink2)">${hint}</text>`:''}
    ${targets}
  </svg>`;
}

const bundledRelease={tag:'v0.3.31',title:'空叶记账 v0.3.31',notes:'- 更新手动记账界面，包括分类网格、金额卡、日期时间选择和计算器。'};
let githubCatalog=null, updateBusy=false, updateError='';
const versionLabel=version=>version?'v'+version.replace(/^v/,''):'未知版本';
function openUpdateSheet(tab,refresh=false){
  document.getElementById('sheet-root').innerHTML=`<div class="mask" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="版本与更新">

function requestUpdateCheck(){
  if(updateBusy)return;
  updateBusy=true;
  updateError='';
  renderUpdateBody();
  Ledger.checkUpdates();
}
function finishUpdateCheck(result){
  updateBusy=false;
  const data=JSON.parse(result);
  updateError=data.error||'';
  if(!updateError) githubCatalog=data;
  renderUpdateBody();
}
function renderReleaseNotes(notes){
  // Release text comes from GitHub. Treat it as text and only emit the markup below.
  const inline=text=>{
    const parts=[];
    let offset=0;
    for(const match of text.matchAll(/`([^`]+)`|\*\*([^*]+)\*\*|__([^_]+)__/g)){
      parts.push(esc(text.slice(offset,match.index)));
      parts.push(match[1]?`<code>${esc(match[1])}</code>`:`<strong>${esc(match[2]||match[3])}</strong>`);
      offset=match.index+match[0].length;
    }
    return parts.join('')+esc(text.slice(offset));
  };
  const blocks=[];
  let paragraph=[],list='';
  function flush(){
    if(paragraph.length){blocks.push(`<p>${inline(paragraph.join(' '))}</p>`);paragraph=[];}
    if(list){blocks.push(`</${list}>`);list='';}
  }
  for(const raw of (notes?.trim()||'暂无版本说明').split(/\r?\n/)){
    const line=raw.trim();
    if(!line){flush();continue;}
    const heading=line.match(/^#{1,6}\s+(.+?)(?:\s+#+)?$/);
    if(heading){flush();blocks.push(`<h4>${inline(heading[1])}</h4>`);continue;}
    const item=line.match(/^(?:([-*+])|(\d+)[.)])\s+(.+)$/);
    if(item){
      const kind=item[1]?'ul':'ol';
      if(list!==kind){flush();list=kind;blocks.push(`<${kind}>`);}
      blocks.push(`<li>${inline(item[3])}</li>`);
      continue;
    }
    if(list)flush();
    paragraph.push(line);
  }
  flush();
  return blocks.join('');
}
function renderUpdateBody(){
  const body=document.getElementById('updates-body');
  if(!body)return;
  const current=versionLabel(Ledger.appVersion());
  const latest=githubCatalog?.releases[0];
  const retry=`<button class="cta-btn ghost" onclick="requestUpdateCheck()" ${updateBusy?'disabled':''}>${updateBusy?'正在检查…':updateError?'重试':'重新检查'}</button>`;
  if(body.dataset.tab==='check'){
    const available=!updateBusy&&!updateError&&latest&&githubCatalog.comparison>0;
    let status='查看 GitHub 上的公开版本';
    if(updateBusy) status='正在检查 GitHub 更新…';
    else if(updateError) status=updateError;
    else if(available) status=`发现新版 ${versionLabel(latest.tag)}`;
    else if(latest&&githubCatalog.comparison===0) status='当前已是最新版本';
    else if(latest&&githubCatalog.comparison<0) status='暂无可安装的更新';
    else if(githubCatalog) status='暂无可比较的公开版本';
    body.innerHTML=`<div class="update-summary" role="status">
      <b>${esc(status)}</b><p>已安装 ${esc(current)}${latest?` · ${updateBusy||updateError?'上次查到':'GitHub 最新'} ${esc(versionLabel(latest.tag))}`:''}</p>
    </div>
    ${available?`<button class="cta-btn" onclick="Ledger.openGitHub('${latest.hasApk?'apk':'release'}',${arg(latest.tag)})">${latest.hasApk?'前往 GitHub 下载 APK':'查看新版发布'}</button>`:''}
    ${retry}`;
    return;
  }
  const releases=[...(githubCatalog?.releases||[])];
  if(!releases.some(entry=>versionLabel(entry.tag)===bundledRelease.tag)) releases.push(bundledRelease);
  releases.sort((a,b)=>versionLabel(b.tag).localeCompare(versionLabel(a.tag),'en',{numeric:true}));
  body.innerHTML=`${updateBusy||updateError?`<p class="update-caption ${updateError?'error':''}" role="status">${esc(updateError||'正在获取 GitHub 发布记录…')}</p>`:''}
    ${releases.map((entry,index)=>`<details class="release-entry" ${index===0?'open':''}>
      <summary>${esc(entry.title)}<span class="release-date">${esc([entry.date,versionLabel(entry.tag)===current?'当前版本':'',entry.github?'GitHub 发布':'随应用提供'].filter(Boolean).join(' · '))}</span></summary>
      <div class="release-notes">${renderReleaseNotes(entry.notes)}</div>
      ${entry.github?`<div class="update-links"><button onclick="Ledger.openGitHub('release',${arg(entry.tag)})">查看 GitHub 发布 ↗</button>
      ${entry.hasApk?`<button onclick="Ledger.openGitHub('apk',${arg(entry.tag)})">下载 APK ↗</button>`:''}</div>`:''}
    </details>`).join('')}${updateError?retry:''}`;
}

const LISTENING_CHANNELS=[
  ['wechat','微信支付通知'],['alipay','支付宝通知'],
  ['sms','银行动账短信'],['unionpay','云闪付通知']
];
let listenerReconnecting=false;
function setListenerReconnect(active){listenerReconnecting=active;if(S.tab==='auto')render();}
function listenerSummary(){
  if(!S.autoGuard)return '已暂停自动监听';
  if(!LISTENING_CHANNELS.some(([channel])=>S.channels[channel]))return '尚未开启任何监听渠道';
  const notifications=notificationListeningState()==='active';
  const sms=listeningState('sms')==='active';
  return notifications?(sms?'通知与短信均在监听':'正在监听支付通知'):sms?'仅在监听银行短信':'暂无正常监听的渠道';
}
function notificationListeningState(){
  const entry=LISTENING_CHANNELS.find(([channel])=>channel!=='sms'&&S.channels[channel]);
  return entry?listeningState(entry[0]):'off';
}
function listenerWarning(){
  if(!S.autoGuard)return '';
  const notificationState=notificationListeningState();
  const notificationWarning={
    permission:'通知待授权',disabled:'通知监听已停用',
    disconnected:listenerReconnecting?'通知监听连接中':'通知监听未连接'
  }[notificationState];
  const smsWarning={permission:'短信待授权',partial:'短信权限不完整'}[listeningState('sms')];

}

function renderListenerRecovery(){

function renderLedgerPermissions(){
  const {notification,sms,reminders,battery}=S.permissions||{};
  const reminderStatus={

function listeningState(channel){
  return (S.channelStatuses||{})[channel]||'off';
}
function channelHint(channel,state){
  return {
    active:'正在监听',off:'已关闭',paused:'自动记账总开关已暂停',
    permission:channel==='sms'?'未授权短信权限':'未开启通知读取权',
    partial:'短信权限不完整',disabled:'通知监听已停用',disconnected:listenerReconnecting?'正在重新连接':'已授权，通知监听未连接'
  }[state];
}
function channelAction(channel,state){
  if(channel==='sms' && (state==='permission'||state==='partial'))return ['去授权','sms'];
  if(state==='permission')return ['去授权','notification'];
  if(state==='disconnected'||state==='disabled')return ['重试','notification-retry'];
  return null;
}
function renderListeningChannel([channel,name]){
  const state=listeningState(channel), action=channelAction(channel,state);

}

  S.channels[channel]=!S.channels[channel];

  if(!save()||!enabled)return;
  const state=listeningState(channel);
  if(state==='active')return;

  const action=channelAction(channel,state);
  if(action)Ledger.configure(action[1]);
}

function fillDavForm(){
  const config=JSON.parse(Ledger.webDavConfig());
  const address=document.getElementById('dav-address');
  const user=document.getElementById('dav-user');
  const password=document.getElementById('dav-pass');
  address.value=address.defaultValue=config.address;
  user.value=user.defaultValue=config.user;
  password.value='';

}
function useSavedDavPassword(input){
  const address=document.getElementById('dav-address');
  const user=document.getElementById('dav-user');
  return input.dataset.saved==='true' && !input.value && !input.dataset.edited &&
    address.value.trim()===address.defaultValue && user.value.trim()===user.defaultValue;

const CUSTOM_PALETTES=[
  ['#fde6df','#ba4e3c','#ee7d68'],['#e3f1fd','#2b67a3','#5ca4e6'],
  ['#e5f5ea','#26784b','#57be82'],['#f0e6fc','#6946b6','#9c7ae3'],

function catPalette(c,dir=mDir){
  if(Object.hasOwn(CBG,c))return {bg:CBG[c], ink:CINK[c]||'#78624d', col:CCOL[c]||'#b5a898'};
  if(!c){
    return dir==='收入'
      ? {bg:'#daf4e6',ink:'#217e50',col:'#2eb872'}
      : {bg:'#efe9df',ink:'#78624d',col:'#b5a898'};
  }
  let hash=0;
  for(const ch of String(c))hash=(hash*31+ch.codePointAt(0))>>>0;
  const [bg,ink,col]=CUSTOM_PALETTES[hash%CUSTOM_PALETTES.length];
  return {bg,ink,col};
}
